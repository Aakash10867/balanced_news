name: site

# Publishes the reading site (site/) to GitHub Pages whenever it changes.
# The page reads published stories straight from Supabase, so it needs no rebuild
# when news changes, only when the page itself changes.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: The audio made so far (nishpaksh/audio.py keeps it on the audio branch)
        run: |
          rm -rf _site && cp -r site _site && mkdir -p _site/audio
          if git clone --quiet --depth 1 --branch audio "https://github.com/${GITHUB_REPOSITORY}.git" /tmp/audio 2>/dev/null; then
            cp /tmp/audio/*.m4a /tmp/audio/*.json _site/audio/ 2>/dev/null || true
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
