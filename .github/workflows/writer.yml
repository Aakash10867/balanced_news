name: writing-desk

# The writing desk (nishpaksh/desk.py), separate from the hourly pipeline (owner, Oct 6 2026): it only
# writes and publishes the most important settled stories, at least one and at most two per clock hour.
# Started at :45 UTC (:15 IST) every hour by Supabase (pg_cron -> workflow_dispatch, see
# supabase/migrations), 40 minutes after the pipeline (:05 UTC = :35 IST) started preparing stories.
# GitHub's own schedule is a backup; the desk never publishes more than two articles in an hour.
on:
  schedule:
    - cron: "55 * * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "who started this run"
        default: "manual"

concurrency:
  group: nishpaksh-desk
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write          # replace the feed branch (ready-made files for the reading site)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Write and publish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RUN_TRIGGER: ${{ github.event.inputs.reason || github.event_name }}
        run: python -m nishpaksh.desk --minutes 20
      - name: Publish the feed for the reading site
        # ready-made files on the feed branch (nishpaksh/feed.py); the site falls back to Supabase
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish_feed.sh
