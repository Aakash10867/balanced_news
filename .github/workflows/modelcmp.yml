name: modelcmp
# Does another model do the light/page work as well as Flash-Lite? Re-runs the analysis on real
# stories in scratch copies, once per model, and compares sentence colours. Site untouched;
# results go to the diagnostics table (kind 'modelcmp').
on:
  workflow_dispatch:
    inputs:
      stories:
        description: "comma-separated story ids (empty: the 6 largest published stories)"
        default: ""
      variants:
        default: "flash,flash2,gemma"
jobs:
  modelcmp:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STORIES: ${{ github.event.inputs.stories }}
          VARIANTS: ${{ github.event.inputs.variants }}
        run: python -m nishpaksh.tools.modelcmp --stories "$STORIES" --variants "$VARIANTS"
