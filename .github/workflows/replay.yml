name: replay
# Re-runs the writing stages on stored real stories with real models, in a scratch copy:
# the site is not touched. Results go to the diagnostics table.
on:
  workflow_dispatch:
    inputs:
      stories:
        description: "comma-separated story ids"
        required: true
      mode:
        description: "write (the whole article), context (only the context checks) or split (compound statements split)"
        required: false
        default: "write"
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:            # the newsroom, loaded read-only from the saved copy (.github/actions/newsroom-load)
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: ./.github/actions/newsroom-load
        env:
          NEWSROOM_KEY: ${{ secrets.NEWSROOM_KEY }}
          GH_TOKEN: ${{ github.token }}
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/newsroom
          READERS_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STORIES: ${{ github.event.inputs.stories }}
          MODE: ${{ github.event.inputs.mode || 'write' }}
        run: python -m nishpaksh.tools.replay --stories "$STORIES" --mode "$MODE"
