name: replay
# Re-runs the writing stages on stored real stories with real models, in a scratch copy:
# the site is not touched. Results go to the diagnostics table.
on:
  workflow_dispatch:
    inputs:
      stories:
        description: "comma-separated story ids"
        required: true
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STORIES: ${{ github.event.inputs.stories }}
        run: python -m nishpaksh.tools.replay --stories "$STORIES"
