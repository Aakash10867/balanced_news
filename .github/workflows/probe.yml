name: probe
# Measures the real world (grouping thresholds, which sites can be read, whether searches work)
# without changing any pipeline data. Results go to the `diagnostics` table.
on:
  push:
    branches: [probe]
  workflow_dispatch:
    inputs:
      parts:
        default: "search,fetch,grouping"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt googlenewsdecoder
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -o pipefail
          python -m nishpaksh.tools.probe --parts "${{ github.event.inputs.parts || 'embedcmp' }}" 2>&1 | tee probe.log
      # the log is pushed to the probe-logs branch so it can be read without a GitHub login
      - if: always()
        run: |
          git config user.name "probe-bot"; git config user.email "probe-bot@users.noreply.github.com"
          mkdir -p /tmp/l && cp probe.log /tmp/l/ 2>/dev/null || echo "no log" > /tmp/l/probe.log
          git fetch origin probe-logs || true
          git checkout --orphan probe-logs-tmp && git rm -rfq . && cp /tmp/l/probe.log "log-${{ github.run_id }}.txt"
          git add "log-${{ github.run_id }}.txt" && git commit -qm "probe log ${{ github.run_id }}"
          git push -f origin HEAD:probe-logs
