name: probe
# Measures the real world (grouping thresholds, which sites can be read, whether searches work)
# without changing any pipeline data. Results go to the `diagnostics` table.
on:
  push:
    branches: [probe]
  workflow_dispatch:
    inputs:
      parts:
        default: "grouping,search,fetch"
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt googlenewsdecoder
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m nishpaksh.tools.probe --parts "${{ github.event.inputs.parts || 'grouping,search,fetch' }}"
