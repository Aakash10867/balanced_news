name: hourly-pipeline

# Started every hour at :05 by Supabase (pg_cron -> workflow_dispatch, see supabase/migrations).
# GitHub's own schedule was removed (owner, Oct 8 2026): it is best-effort, skipped hours at a time,
# and only added runs the gate had to turn away. The gate lets the Supabase trigger through only if
# no run has started recently. "Run workflow" (manual) always goes ahead.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "who started this run"
        default: "manual"

concurrency:
  group: nishpaksh-pipeline
  cancel-in-progress: false   # never run two pipelines on the same database at once

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "sqlalchemy>=2.0" "psycopg2-binary>=2.9" "pyyaml>=6.0"
      - id: check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REASON: ${{ github.event.inputs.reason }}
        run: |
          reason="$REASON"
          if [ "$reason" = "supabase-cron" ]; then
            python -m nishpaksh.gate --min-gap 35 | tee -a "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"; echo "manual run: going ahead"
          fi

  run:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    # Safety net only, for a run that hangs. The pipeline's own 45-minute deadline is a
    # checkpoint: it stops starting new work, finishes what is in progress, and leaves the
    # rest for the next run, so this limit should never be what ends a healthy run.
    timeout-minutes: 75
    permissions:
      contents: write          # push articles older than 3 days to the archive branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore the cache of article text and vectors
        # heavy columns are read from Supabase only when new or changed (nishpaksh/heavy.py: egress)
        uses: actions/cache@v4
        with:
          path: .heavycache
          key: heavy-${{ github.run_id }}
          restore-keys: heavy-
      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RUN_TRIGGER: ${{ github.event.inputs.reason || github.event_name }}
          NISHPAKSH_HEAVY_CACHE: .heavycache/heavy.sqlite
        run: python -m nishpaksh.run --time-budget 45
      - name: Move articles older than 3 days to the archive branch
        # a story leaves the database only after its page is pushed (nishpaksh/pagearchive.py)
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/archive_pages.sh
      - name: Publish the feed for the reading site
        # colours matured and old articles archived: refresh the site's ready-made files (nishpaksh/feed.py)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish_feed.sh
