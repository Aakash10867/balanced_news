# Titles, roles and how they relate: ONE place for what style.py, people.py and voice.py used to keep
# in three separate lists (owner, Oct 10 2026: names and titles kept going wrong because every module
# had its own idea of what a title is).
#
# honorifics   words put before a name that say nothing about the job (stripped from a name).
# roles        one entry per job. `forms` are the ways outlets write it (synonyms; the first is the one
#              the article uses). `is_a` says it is a KIND OF another role (a CJI is a Supreme Court
#              judge; a Supreme Court judge is not a CJI). `requires_any` is a condition: the form is read
#              as this role only when one of these words appears in the article text ("Chief Justice"
#              alone is the CJI only in an article about the Supreme Court / India). `ref` is how the
#              article may point back at the person without a name ("the minister").
#              `person: false` marks a word that may sit before a name but is no evidence of a person
#              ("Union", "Deputy"): it is stripped, never used to decide something is a person.
# Entries are added here by hand or from what outlets show (a title seen before a name in two or more
# independent outlets); a model is never the only source for one.

honorifics: [Mr, Mrs, Ms, Dr, Shri, Smt, Sri, Shrimati, Kumari, Sardar, Pandit, Swami, Maulana, Sheikh, Saint, Prof, Professor]

# words that may open or sit inside a title but prove nothing alone
qualifiers: [Union, Deputy, Chief, Vice, Senior, Additional, Joint, Assistant, Acting, Former, Late, Retired,
             State, National, Home, Finance, Defence, External, Affairs, Foreign, Railway, Health, Education,
             Law, Information, Broadcasting, Agriculture, Commerce, Industry, Rural, Urban, Social, Justice,
             District, Station, House, Sub, Lieutenant, Air, Wing, Squadron, Group, Flight]

roles:
