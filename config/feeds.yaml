# Outlets to read. No ideology labels here, on purpose: perspectives are learned
# from which articles agree with which, not assigned by hand.
# The list deliberately spans the spectrum so that perspectives can emerge.
#
# Feed URLs change. Run `python -m nishpaksh.tools.check_feeds` after adding one.
# A feed that fails 24 runs in a row (one day) is disabled automatically and logged.
#
# role: news     -> ordinary reporting
# role: official -> government/court sources; ingested like news, but their own
#                   statements count as "official_statement" evidence, never as truth.
# beat: domains | sport -> a specialist feed (owner, Oct 9 2026): same rules as every feed; a story whose
#                   articles come half or more from such feeds gets the reserved reading places and the
#                   desk's Domains/Sport seat (priority.py, desk.py).

