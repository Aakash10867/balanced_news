# Quota-aware model pools.
# Each tier is a list of interchangeable models. The router uses whichever model
# in the tier has quota left and falls back to the next one when a model runs out.
# Limits are the free-tier numbers from the AI Studio dashboard (Oct 2026).
# Model IDs are resolved against the live model list at the start of every run,
# so close-enough names (e.g. "gemma-4-26b" -> "gemma-4-26b-a4b-it") still work.
# Run `python -m nishpaksh.tools.list_models` to see the exact IDs on your key.

tiers:
  # Reads articles: events, claims, times, loaded words.
  # Flash-Lite first: Gemma 4 on the free tier is heavily overloaded (mostly 500/504 errors
  # in testing), so it is kept as overflow. `keep` leaves 150 Flash-Lite requests a day each
  # for matching, headlines and translation.
  bulk:
    - {id: gemini-3.5-flash-lite, rpm: 15, tpm: 250000, rpd: 500, json_mode: true, keep: 150}
    - {id: gemini-3.1-flash-lite, rpm: 15, tpm: 250000, rpd: 500, json_mode: true, keep: 150}
    - {id: gemma-4-31b-it, rpm: 30, tpm: 16000, rpd: 14400, json_mode: false}
    - {id: gemma-4-26b-it, rpm: 30, tpm: 16000, rpd: 14400, json_mode: false}

  # Independent second opinion on verdicts: a different model family from the judge tier.
  second:
    - {id: gemma-4-31b-it, rpm: 30, tpm: 16000, rpd: 14400, json_mode: false}
    - {id: gemma-4-26b-it, rpm: 30, tpm: 16000, rpd: 14400, json_mode: false}

  # Analysis: statement matching, consolidation, who-said-what, fact vs characterisation, and
  # the same-event check in grouping. These decide sentence colours, so model changes here need
  # tools/modelcmp first. `keep` leaves 60 a day on each model for the page tier below.
  light:
    - {id: gemini-3.5-flash-lite, rpm: 15, tpm: 250000, rpd: 500, json_mode: true, keep: 60}
    - {id: gemini-3.1-flash-lite, rpm: 15, tpm: 250000, rpd: 500, json_mode: true, keep: 60}

  # Building the page: headline, importance, thread links, Hindi translation. Same models as
  # light but nothing kept back, so the last steps of a run are never the ones starved.
  # Every tier is paced over the quota day (router.pace_cap).
  page:
    - {id: gemini-3.5-flash-lite, rpm: 15, tpm: 250000, rpd: 500, json_mode: true}
    - {id: gemini-3.1-flash-lite, rpm: 15, tpm: 250000, rpd: 500, json_mode: true}

  # Writes the readable story from the checked statements. Flash only: Flash-Lite essays read
  # badly (Oct 2026), and a story with no good essay waits rather than being published stitched.
  # Red verdicts are on hold (no second model family on the free tier now that Gemma is out), so
  # the judge makes no calls and the writer keeps nothing back for it.
  writer:
    - {id: gemini-3.8-flash, rpm: 5, tpm: 250000, rpd: 20, json_mode: true}
    - {id: gemini-3.7-flash, rpm: 5, tpm: 250000, rpd: 20, json_mode: true}
    - {id: gemini-3.6-flash, rpm: 5, tpm: 250000, rpd: 20, json_mode: true}
    - {id: gemini-3.5-flash, rpm: 5, tpm: 250000, rpd: 20, json_mode: true}
    - {id: gemini-3-flash, rpm: 5, tpm: 250000, rpd: 20, json_mode: true}
    # A Flash model of the previous generation, with its own quota. Kept for search grounding while red
    # verdicts were on; they are on hold, so its calls go to the writer (Oct 5 2026: the 3.x Flash
    # models answered nearly every writer call with 503 "high demand" in the Indian afternoon).
    - {id: gemini-2.5-flash, rpm: 5, tpm: 250000, rpd: 20, json_mode: true}

  # Verdicts on contested claims. Gemma (second tier) gives the independent second opinion.
  # gemini-2.5-flash is deliberately NOT here: its 20/day are reserved for search grounding.
  judge:
    - {id: gemini-3.8-flash, rpm: 5, tpm: 250000, rpd: 20, json_mode: true}
    - {id: gemini-3.7-flash, rpm: 5, tpm: 250000, rpd: 20, json_mode: true}
    - {id: gemini-3.6-flash, rpm: 5, tpm: 250000, rpd: 20, json_mode: true}
    - {id: gemini-3.5-flash, rpm: 5, tpm: 250000, rpd: 20, json_mode: true}
    - {id: gemini-3-flash, rpm: 5, tpm: 250000, rpd: 20, json_mode: true}
    - {id: gemini-robotics-er-2-preview, rpm: 5, tpm: 250000, rpd: 20, json_mode: true}

  # Google Search grounding for primary evidence (FIRs, court orders, official data).
  # Only the 2.5 family has grounding quota on the free tier.
  grounded:
    - {id: gemini-2.5-flash, rpm: 5, tpm: 250000, rpd: 20, json_mode: false, grounding: true}
    - {id: gemini-2.5-flash-lite, rpm: 10, tpm: 250000, rpd: 20, json_mode: false, grounding: true}

  # Story grouping. Exactly ONE model: vectors from two models are not comparable (mixing them
  # made unrelated articles look 0.97 similar). Chosen on 216 real article pairs labelled
  # same / related / different event (tools/probe.py embedcmp, Oct 2026), title + 400-char lead:
  #   gemini-embedding-001  AUC same-vs-rest 0.931 (vs different 0.991)
  #   gemini-embedding-2    AUC 0.911;  stored mixed vectors 0.731
  # Google counts each text in a batch as one request: rpd/rpm here are texts.
  embed:
    - {id: gemini-embedding-001, rpm: 100, tpm: 30000, rpd: 1000}
