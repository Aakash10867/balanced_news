<link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Rozha+One&family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Noto+Serif+Devanagari:wght@600&family=Tiro+Devanagari+Hindi&family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* nishpaksh_version_1.0 (owner, Oct 8 2026): one card at a time, the card grows into the article.
     Design approved on the canvas as trial_version_0.6; version 1.1 (indigo, serif headlines, upright greeting). Served at the main address since Oct 8 2026; /v1/ redirects here. */
  :root {
    --ground: #ECECE9;
    --card: #ffffff;
    --ink: #16181A;
    --ink-soft: #3d4043;
    --muted: #5f6368;
    --edge: #d3d3cf;
    /* sentence colours (text on white) */
    --est: #1d6a45; --unv: #5f6368; --one: #6a3d9a; --dis: #8a6100; --fal: #b2251c;
    /* the colour bar */
    --bar-e: #2f8a5b; --bar-o: #7a4bb0; --bar-d: #d39a12; --bar-r: #c0392b; --bar-u: #a3a6aa;
    /* version 1.1 (owner, Oct 8 2026): one indigo, light to deep; the multicolour sweep read as Instagram */
    --brand: radial-gradient(120% 130% at 0% 0%, rgba(140,160,255,0.22) 0%, rgba(140,160,255,0) 55%),
             linear-gradient(135deg, #46549a 0%, #2f3a72 45%, #1f2550 75%, #161a38 100%);
    --ease: cubic-bezier(.2,.8,.2,1);
    --head: "Newsreader", Georgia, "Noto Serif Devanagari", serif;
    --body: "Hind", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  html.hi { --head: "Noto Serif Devanagari", "Hind", serif; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { background: var(--ground); color: var(--ink); font-family: var(--body); text-rendering: optimizeLegibility; }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid #46549a; outline-offset: 3px; border-radius: 6px; }

  #app { height: 100vh; height: 100dvh; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px;
         --padr: max(14px, env(safe-area-inset-right)); --padl: max(14px, env(safe-area-inset-left));
         padding: max(14px, env(safe-area-inset-top)) var(--padr) 0 var(--padl); }

  /* header: the wordmark, the greeting, the language switch */
  .brand { background: var(--brand); }
  .lift { text-shadow: 0 1px 2px rgba(0,0,0,0.35), 0 0 18px rgba(0,0,0,0.18); }
  header.top { color: #fff; border-radius: 22px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; flex: none; }
  .wordmark { display: flex; justify-content: center; font-family: "Alfa Slab One", "Rozha One", serif; font-size: 23px;
              letter-spacing: 0.6px; line-height: 1.15; }
  html.hi .wordmark { font-family: "Rozha One", serif; font-size: 26px; letter-spacing: 0.3px; }
  .greetrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .greeting { font-family: "Newsreader", Georgia, serif; font-weight: 500; font-size: 22px; line-height: 1.1; }
  html.hi .greeting { font-family: "Tiro Devanagari Hindi", serif; font-size: 21px; }
  .pill { display: flex; flex: none; background: rgba(18,12,30,0.34); border: 1px solid rgba(255,255,255,0.22); border-radius: 999px;
          padding: 3px; font-size: 14px; font-weight: 600; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .pill button { border: 0; background: transparent; color: #fff; border-radius: 999px; padding: 4px 11px; min-height: 30px; cursor: pointer;
                 transition: background-color 200ms ease, color 200ms ease; }
  .pill button[aria-pressed="true"] { background: #fff; color: #1f2550; }
  .pill.light { background: #fff; border: 0; box-shadow: 0 2px 0 var(--edge); -webkit-backdrop-filter: none; backdrop-filter: none; }
  .pill.light button { color: var(--ink); padding: 6px 11px; min-height: 36px; }
  .pill.light button[aria-pressed="true"] { background: linear-gradient(135deg, #46549a, #1f2550); color: #fff; }

  /* the deck: one card at a time, swiped up and down, looping */
  #deck { flex: 1; min-height: 0; position: relative; }
  .track { position: absolute; inset: 0; overflow-y: scroll; scroll-snap-type: y mandatory; overscroll-behavior: contain;
           scrollbar-width: none; -ms-overflow-style: none; outline: none; }
  .track::-webkit-scrollbar { display: none; width: 0; height: 0; }
  .slot { height: 100%; padding-bottom: 12px; scroll-snap-align: start; scroll-snap-stop: always; }
  .card { height: 100%; display: flex; flex-direction: column; background: var(--card); border-radius: 24px; box-shadow: 0 4px 0 var(--edge);
          padding: 24px 22px 18px; text-decoration: none; color: var(--ink); transition: transform 160ms ease; overflow: hidden; }
  .card:active { transform: scale(0.985); }
  .card h2 { margin: 0; font-family: var(--head); font-weight: 600; font-size: 27px; line-height: 1.15; letter-spacing: -0.005em; text-align: start; }
  html.hi .card h2 { font-size: 24px; line-height: 1.45; letter-spacing: 0; font-weight: 600; }
  .card .text { flex: 1; min-height: 0; overflow: hidden; margin-top: 14px; font-size: 17px; line-height: 1.65;
                -webkit-mask-image: linear-gradient(to bottom, #000 45%, transparent 100%); mask-image: linear-gradient(to bottom, #000 45%, transparent 100%); }
  .card .text p { margin: 0 0 10px; }
  .card .foot { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
  .bar { flex: 1; display: flex; height: 8px; border-radius: 999px; overflow: hidden; gap: 2px; }
  .bar span { flex-basis: 0; min-width: 0; }
  .ago { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .state { height: 100%; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px;
           background: var(--card); border-radius: 24px; box-shadow: 0 4px 0 var(--edge); color: var(--ink-soft); font-size: 16px; line-height: 1.5; }
  .loading .bone { background: #efefec; border-radius: 8px; height: 18px; margin: 0 0 12px; }

  /* sentence colours */
  .s.established, .s.corroborated, .s.confirmed { color: var(--est); }
  .s.developing { color: var(--unv); text-decoration: underline dotted #9aa0a6; text-underline-offset: 4px; }
  .s.unverified, .s.pending { color: var(--unv); }
  .s.single { color: var(--one); }
  .s.disputed { color: var(--dis); }
  .s.false { color: var(--fal); }
  .ftag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .06em; color: #fff; background: var(--fal);
          border-radius: 4px; padding: 1px 5px; margin-right: 5px; vertical-align: 2px; }

  /* the article: a sheet that grows out of the card */
  #sheet { position: fixed; inset: 0; z-index: 10; background: var(--card); visibility: hidden; }
  #sheet.on { visibility: visible; }
  #sheet.anim { transition: clip-path 460ms var(--ease), -webkit-clip-path 460ms var(--ease), background-color 460ms ease; }
  #sheet.open { background: var(--ground); }
  .sheet-scroll { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .sheet-scroll::-webkit-scrollbar { display: none; }
  .col { max-width: 560px; margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) 48px max(14px, env(safe-area-inset-left)); }
  /* back button | wordmark | language: equal side columns keep the wordmark at the true centre */
  .chrome { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 2px 2px 12px; opacity: 0; }
  .chrome > :first-child { justify-self: start; }
  .chrome > :last-child { justify-self: end; }
  #sheet.anim .chrome { transition: opacity 260ms ease 220ms; }
  #sheet.open .chrome { opacity: 1; }
  .back { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; border: 0;
          background: #fff; box-shadow: 0 2px 0 var(--edge); cursor: pointer; }
  .chrome .wordmark { color: var(--ink); font-size: 19px; }
  html.hi .chrome .wordmark { font-size: 21px; }
  .hbox { position: relative; border-radius: 22px; color: var(--ink); padding: 0 var(--hx, 22px); transform: translate(0, var(--hy, 0px)); }
  .hbox .layer { position: absolute; inset: 0; border-radius: 22px; opacity: 0; }
  #sheet.anim .hbox { transition: padding 460ms var(--ease), transform 460ms var(--ease), color 320ms ease 120ms; }
  #sheet.anim .hbox .layer { transition: opacity 340ms ease 100ms; }
  #sheet.open .hbox { padding: 18px; transform: none; color: #fff; }
  #sheet.open .hbox .layer { opacity: 1; }
  #sheet.open .hbox h1 { text-shadow: 0 1px 2px rgba(0,0,0,0.35), 0 0 18px rgba(0,0,0,0.18); }
  .hbox h1 { position: relative; margin: 0; font-family: var(--head); font-weight: 600; font-size: 27px; line-height: 1.15; letter-spacing: -0.005em; }
  html.hi .hbox h1 { font-size: 24px; line-height: 1.45; letter-spacing: 0; }
  .hbox .meta { position: relative; margin-top: 10px; font-size: 13px; opacity: 0; }
  #sheet.open .hbox .meta { opacity: .92; }
  #sheet.anim .hbox .meta { transition: opacity 260ms ease 260ms; }
  .rise { opacity: 0; transform: translateY(24px); }
  #sheet.anim .rise { transition: opacity 300ms ease 200ms, transform 420ms var(--ease) 160ms; }
  #sheet.open .rise { opacity: 1; transform: none; }

  .key { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 12px 4px 0; font-size: 13px; font-weight: 500; }
  .key span { white-space: nowrap; }
  .paper { margin-top: 12px; background: #fff; border-radius: 20px; padding: 16px; box-shadow: 0 3px 0 var(--edge); }
  .essay { font-size: 17.5px; line-height: 1.7; }
  html.hi .essay { font-size: 18px; line-height: 1.8; }
  .essay p { margin: 0 0 12px; }
  .essay p:last-child { margin-bottom: 0; }
  .essay h3 { font-family: var(--head); font-size: 19px; font-weight: 600; letter-spacing: -0.01em; margin: 20px 0 8px; color: var(--ink); }
  sup { font-size: 10.5px; line-height: 0; color: #7a7d81; margin-left: 1px; }
  sup a { text-decoration: none; color: inherit; padding: 0 1px; }
  .sec { font-family: var(--head); font-size: 19px; font-weight: 600; letter-spacing: -0.01em; margin: 24px 4px 8px; }
  .note { margin: 12px 4px 0; font-size: 14.5px; line-height: 1.55; color: var(--ink-soft); }
  .helpline { background: #fff7e6; border-radius: 14px; padding: 12px 14px; color: #5a4300; }
  .thread { margin: 0; padding: 0; list-style: none; }
  .thread li + li { border-top: 1px solid #efefec; }
  .thread a { display: block; padding: 10px 0; font-size: 16px; line-height: 1.4; text-decoration: none; }
  .sources { margin: 0; padding: 0; list-style: none; font-size: 14.5px; line-height: 1.45; }
  .sources li { display: grid; grid-template-columns: 26px 1fr; gap: 2px 8px; padding: 9px 0; scroll-margin-top: 90px; }
  .sources li + li { border-top: 1px solid #efefec; }
  .sources b { color: var(--muted); font-weight: 600; font-size: 13px; padding-top: 1px; }
  .sources .outlet { font-weight: 600; }
  .sources a { color: var(--ink-soft); text-decoration: underline; text-decoration-color: #c9c9c4; text-underline-offset: 3px; }
  .sources .unread { color: var(--muted); }
  .sources .why { display: block; font-size: 12.5px; color: var(--muted); }
  .sources li.flash { background: #f6f1fb; border-radius: 10px; }
  details.who > summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px;
                          font-family: var(--head); font-size: 17px; font-weight: 600; min-height: 28px; }
  details.who > summary::-webkit-details-marker { display: none; }
  details.who > summary::after { content: ""; width: 9px; height: 9px; border-right: 2px solid var(--ink); border-bottom: 2px solid var(--ink);
                                 transform: rotate(45deg); transition: transform 200ms ease; margin-right: 4px; flex: none; }
  details.who[open] > summary::after { transform: rotate(-135deg); }
  .stmt { padding: 12px 0; border-top: 1px solid #efefec; font-size: 15.5px; line-height: 1.5; }
  .stmt:first-of-type { margin-top: 10px; }
  .stmt .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; }
  .stmt .by { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .stmt .by a, .stmt .by span { font-size: 12.5px; text-decoration: none; background: #f2f2ef; color: var(--ink-soft); border-radius: 999px; padding: 3px 9px; }
  .stmt .by a.den { background: #fbe9e7; color: #8c2a20; }
  .stmt .by .lbl { background: none; padding: 3px 0; color: var(--muted); }
  table.framing { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.framing th, table.framing td { text-align: left; vertical-align: top; padding: 6px 6px 6px 0; border-top: 1px solid #efefec; }
  .tablebox { overflow-x: auto; }
  .persp { font-size: 15px; line-height: 1.6; }

  @media (max-width: 360px) {
    .card h2, .hbox h1 { font-size: 24px; }
    html.hi .card h2, html.hi .hbox h1 { font-size: 22px; }
    .card .text { font-size: 16px; }
  }
  @media (min-width: 700px) {
    #app { padding-top: 22px; }
    .card { padding: 30px 30px 22px; }
    .card h2 { font-size: 32px; }
  }
  /* the sections bar (owner, Oct 9 2026; designed on the canvas as "Sections A"): joined to the bottom edge,
     rounded on top, the header's indigo. Five primary sections and All; a primary slides to the left end and
     becomes the back button while its five sub-sections take the other places. Hidden while an article is open. */
  nav.sections { flex: none; position: relative; z-index: 11; color: #fff;
                 margin: 0 calc(-1 * var(--padr)) 0 calc(-1 * var(--padl));
                 padding: 5px 10px calc(7px + env(safe-area-inset-bottom)); border-radius: 24px 24px 0 0;
                 box-shadow: 0 -2px 12px rgba(22,26,56,0.12); transition: transform 380ms cubic-bezier(.4,0,.2,1); }
  html.reading nav.sections { transform: translateY(calc(100% + 24px)); }
  .sbar { position: relative; height: 42px; font-size: 12.5px; }
  .sb { position: absolute; top: 0; bottom: 0; padding: 0; margin: 0; border: 0; background: transparent; cursor: pointer;
        opacity: 1; transform: none; --d: 0ms;
        transition: left 440ms var(--ease), width 440ms var(--ease), opacity 220ms ease var(--d), transform 320ms var(--ease) var(--d); }
  .sb.hide { opacity: 0; transform: translateY(10px); pointer-events: none; }
  .sb .face { position: absolute; top: 0; bottom: 0; left: 2px; right: 2px; display: flex; align-items: center; justify-content: center;
              gap: 3px; border-radius: 17px; white-space: nowrap; line-height: 1; overflow: hidden; font-weight: 600;
              color: rgba(255,255,255,0.9); transition: background-color 220ms ease, color 220ms ease, transform 120ms ease; }
  .sb:active .face { transform: scale(0.96); }
  .sb.empty .face { color: rgba(255,255,255,0.45); }
  .sb.isback .face { background: rgba(255,255,255,0.16); color: #fff; }
  .sb[aria-pressed="true"] .face { background: #fff; color: #1f2550; font-weight: 700; }
  .sb .lbl { display: block; line-height: 1; }
  .sb .chev { display: block; flex: none; width: 0; opacity: 0; overflow: hidden; transition: width 380ms var(--ease), opacity 260ms ease; }
  .sb.isback .chev { width: 10px; opacity: 1; }
  .track { transition: opacity 170ms ease, transform 260ms var(--ease); }
  .track.swap { opacity: 0; transform: translateY(8px); }
  .state .empty-sec { display: flex; flex-direction: column; align-items: center; gap: 12px; max-width: 290px; }
  .state .empty-sec h2 { margin: 0; font-family: var(--head); font-size: 24px; font-weight: 600; line-height: 1.25; color: var(--ink); }
  .state .empty-sec p { margin: 0; font-size: 15.5px; line-height: 1.55; color: var(--muted); }
  .state .empty-sec button { margin-top: 6px; border: 0; border-radius: 999px; padding: 10px 20px; min-height: 44px; color: #fff;
                             font-weight: 600; font-size: 15px; cursor: pointer; }

  /* launch screen: the splash, continued inside the page, then faded away */
  #intro { display: none; }
  html.launch #intro { display: flex; position: fixed; inset: 0; z-index: 30; align-items: center; justify-content: center;
                       background: #1f2550; transition: opacity 360ms ease 160ms, visibility 0s linear 520ms; }
  html.launch #intro img { width: min(52vw, 300px); height: auto; transition: opacity 160ms ease, transform 200ms ease; }
  html.launch.ready #intro { opacity: 0; visibility: hidden; }
  html.launch.ready #intro img { opacity: 0; transform: scale(0.96); }
  .greeting { transition: opacity 220ms ease; }
  .greeting.swap { opacity: 0; }
  @media (prefers-reduced-motion: reduce) {
    nav.sections, .sb, .track { transition-duration: 1ms !important; transition-delay: 0ms !important; }
    #sheet.anim, #sheet.anim .hbox, #sheet.anim .rise, #sheet.anim .chrome, #sheet.anim .hbox .layer { transition-duration: 1ms !important; transition-delay: 0ms !important; }
  }
</style>
</head>
<body>
<div id="intro" aria-hidden="true"><img src="mark.png" alt=""></div>
<div id="app">
  <header class="top brand">
    <div class="wordmark lift" id="wm">Nishpaksh</div>
    <div class="greetrow">
      <div class="greeting lift" id="greet">Hello.</div>
      <div class="pill" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button><button type="button" data-lang="hi" aria-pressed="false" lang="hi">हिं</button>
      </div>
    </div>
  </header>
  <main id="deck" aria-live="polite">
    <div class="track" id="track" tabindex="-1"></div>
  </main>
  <nav class="sections brand" id="sections" aria-label="Sections"><div class="sbar" id="sbar"></div></nav>
</div>
<div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-h">
  <div class="sheet-scroll" id="sheet-scroll">
    <div class="col">
      <div class="chrome">
        <button type="button" class="back" id="back" aria-label="Back to all stories">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16181A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="wordmark" id="wm2">Nishpaksh</div>
        <div class="pill light" role="group" aria-label="Language">
          <button type="button" data-lang="en" aria-pressed="true">EN</button><button type="button" data-lang="hi" aria-pressed="false" lang="hi">हिं</button>

function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private mode */ } }

function istHour() {
  try { return Number(new Intl.DateTimeFormat("en-GB", {hour: "numeric", hourCycle: "h23", timeZone: "Asia/Kolkata"}).format(new Date())); }
  catch (e) { return new Date().getHours(); }
}
function greeting() {
  const h = istHour(), g = T[lang].greet;
  return h >= 4 && h < 12 ? g[0] : h >= 12 && h < 17 ? g[1] : g[2];
}
function ago(ts) {
  const t = T[lang], then = new Date(/Z|[+-]\d\d:?\d\d$/.test(ts) ? ts : ts + "Z");
  const mins = Math.max(1, Math.round((Date.now() - then) / 60000));
  if (mins < 60) return t.ago(mins, t.units.m);
  const h = Math.round(mins / 60);
  return h < 48 ? t.ago(h, t.units.h) : t.ago(Math.round(h / 24), t.units.d);
}
async function getJSON(url, opts = {}, ms = 6000) {
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), ms);
  try {
    const r = await fetch(url, {...opts, signal: ctl.signal});
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return await r.json();
  } finally { clearTimeout(timer); }
}
function api(path) {
  return getJSON(`${SUPABASE_URL}/rest/v1/${path}`, {headers: {apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`}}, 12000);
}

/* ---------- data: the feed first, Supabase if the feed is missing ---------- */
const cardCache = {};          // lang -> every card (one per thread, newest first); the deck shows a section's first MAX_CARDS
const storyCache = new Map();  // id -> Promise<row|null>

function cardText(paras, limit = 9) {       // as nishpaksh/feed.py _card_text
  const out = []; let n = 0;
  for (const para of paras || []) {
    if (n >= limit) break;
    const keep = [];
    for (const s of para || []) {
      if (n >= limit) break;
      const it = {t: s.text || "", c: s.class || "unverified"};
      if (s.parts && s.parts.length > 1) it.p = s.parts.map(p => ({t: p.text || "", c: p.class || "unverified"}));
      keep.push(it); n++;
    }
    if (keep.length) out.push(keep);
  }
  return out;
}
function barCounts(paras) {                   // as nishpaksh/feed.py bar_counts
  const c = {e: 0, o: 0, d: 0, r: 0, u: 0};
  for (const para of paras || []) for (const s of para || []) {
    const ks = s.parts && s.parts.length > 1 ? s.parts.map(p => p.class) : [s.class];
    for (const k of ks) c[BARKEY[k] || "u"] += 1;
  }
  return c;
}
async function loadCards(l) {
  if (cardCache[l]) return cardCache[l];
  let stories = null;
  try {
    const d = await getJSON(`${FEED_URL}/${l}.json`, {cache: "no-cache"}, 5000);
    if (d && Array.isArray(d.stories) && d.stories.length) stories = d.stories;
    if (d && d.sections && d.sections.tree) SECTIONS[l] = d.sections;
  } catch (e) { /* the feed is missing or slow: read the database */ }
  if (!stories) {
    const rows = await api("published?select=story_id,updated_at,headline_en,headline_hi," +
      "pe:payload_en->narrative->paragraphs,ph:payload_hi->narrative->paragraphs,counts:payload_en->counts," +
      "thread:payload_en->thread,parents:payload_en->parents,cat:payload_en->category&order=updated_at.desc&limit=200");
    stories = rows.filter(r => r.pe && r.pe.length).map(r => ({
      id: r.story_id, at: r.updated_at, thread: r.thread || r.story_id, ongoing: !!(r.parents && r.parents.length),
      h: (l === "hi" && r.headline_hi) || r.headline_en, paras: cardText(l === "hi" && r.ph && r.ph.length ? r.ph : r.pe),
      bar: barCounts(r.pe), n: (r.counts || {}).independent_sources || 0, cat: r.cat || {}}));
  }
  // one card per thread: its latest development, newest first (owner, Oct 6 2026)
  const byThread = new Map();
  for (const s of stories) {
    const k = s.thread || s.id, cur = byThread.get(k);
    if (!cur) byThread.set(k, {...s, size: 1});
    else { cur.size += 1; if (new Date(s.at) > new Date(cur.at)) byThread.set(k, {...s, size: cur.size}); }
  }
  const all = [...byThread.values()].sort((a, b) => new Date(b.at) - new Date(a.at));
  cardCache[l] = all;
  return all;
}
async function fromArchive(id) {
  if (!("DecompressionStream" in window)) return null;
  try {
    const r = await fetch(`${ARCHIVE_URL}/pages/${encodeURIComponent(id)}.json.gz`);
    if (!r.ok) return null;
    const p = await new Response(r.body.pipeThrough(new DecompressionStream("gzip"))).json();
    return {story_id: p.story_id, updated_at: p.written_at, headline_en: p.headline_en, headline_hi: p.headline_hi,
            payload_en: p.payload_en, payload_hi: p.payload_hi};
  } catch (e) { return null; }
}
function loadStory(id) {
  id = String(id);
  if (!storyCache.has(id)) {
    const p = (async () => {
      try { return await getJSON(`${FEED_URL}/story/${encodeURIComponent(id)}.json`, {}, 5000); } catch (e) { /* fall through */ }
      try { const rows = await api(`published?story_id=eq.${encodeURIComponent(id)}&select=*`); if (rows.length) return rows[0]; } catch (e) { /* fall through */ }
      return await fromArchive(id);
    })();
    p.then(v => { if (!v) storyCache.delete(id); }, () => storyCache.delete(id));
    storyCache.set(id, p);
  }
  return storyCache.get(id);
}

function cardHtml(c, i) {
  const b = c.bar || {e: 0, o: 0, d: 0, r: 0, u: 0};

      <span class="ago">${esc(ago(c.at))}</span></div></a></div>`;

function renderDeck(keepId) {
  if (!cards.length && fKey !== "all") {
    const t = T[lang];
    track.innerHTML = `<div class="slot"><div class="state"><div class="empty-sec">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#7d84b0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5"/></svg>

  const n = cards.length;
  // loop: a copy of the last card before the first and of the first after the last
  const slots = n > 1 ? [[cards[n - 1], n - 1], ...cards.map((c, i) => [c, i]), [cards[0], 0]] : [[cards[0], 0]];
  track.innerHTML = slots.map(([c, i]) => cardHtml(c, i)).join("");

function slotHeight() { return track.clientHeight || 1; }
function jumpTo(i) {   // i: index in cards; no animation
  const pos = cards.length > 1 ? i + 1 : 0;
  track.style.scrollSnapType = "none";
  track.scrollTop = pos * slotHeight();
  current = i;
  requestAnimationFrame(() => { track.style.scrollSnapType = ""; });
  prefetchAround();
}
function onSettle() {
  const n = cards.length;
  if (!n) return;
  const k = Math.round(track.scrollTop / slotHeight());
  if (n > 1 && k === 0) return jumpTo(n - 1);
  if (n > 1 && k === n + 1) return jumpTo(0);
  current = n > 1 ? k - 1 : 0;
  prefetchAround();
}
track.addEventListener("scroll", () => { clearTimeout(settleTimer); settleTimer = setTimeout(onSettle, 130); }, {passive: true});
if ("onscrollend" in window) track.addEventListener("scrollend", () => { clearTimeout(settleTimer); onSettle(); });
function prefetchAround() {
  if (!cards.length) return;
  for (const d of [0, 1, 2, -1]) { const c = cards[(current + d + cards.length) % cards.length]; if (c) loadStory(c.id); }
}
function step(d) { track.scrollBy({top: d * slotHeight(), behavior: "smooth"}); }

track.addEventListener("click", e => {
  const a = e.target.closest("a.card");
  if (!a) return;
  e.preventDefault();
  openStory(a.dataset.id, a);
});
track.addEventListener("pointerdown", e => { const a = e.target.closest("a.card"); if (a) loadStory(a.dataset.id); }, {passive: true});

function ranges(nums) {
  const out = [];
  for (const n of [...nums].sort((a, b) => a - b)) {
    const last = out[out.length - 1];
    if (last && n === last[1] + 1) last[1] = n; else out.push([n, n]);
  }
  return out;
}
function essayHtml(nar, t) {
  const names = Object.fromEntries((nar.sources || []).map(s => [s.n, s.outlet]));
  const link = a => `<a href="#src-${a}" data-src="${a}" title="${esc(names[a] || "")}">${a}</a>`;
  const sent = x => {
    const nums = x.sources || [];
    const sup = ranges(nums).map(([a, b]) => b === a ? link(a) : `${link(a)}–${link(b)}`).join(",");
    const tag = x.class === "false" ? `<span class="ftag">${esc(t.falseTag)}</span>` : "";
    const body = x.parts && x.parts.length > 1
      ? x.parts.map(p => `<span class="s ${esc(cls(p.class))}">${esc(p.text)}</span>`).join(" ")
      : `<span class="s ${esc(cls(x.class))}">${esc(x.text)}</span>`;
    return `${tag}${body}${sup ? `<sup>${sup}</sup>` : ""}`;
  };
  const keys = nar.section_keys || [];
  let last = null;
  return (nar.paragraphs || []).map((para, k) => {
    const key = keys[k];
    const head = key && key !== last && key !== "news" && t.sections[key] ? `<h3>${esc(t.sections[key])}</h3>` : "";
    last = key || last;
    return head + "<p>" + para.map(sent).join(" ") + "</p>";
  }).join("");
}
function keyHtml(t, nar) {
  const present = new Set();
  for (const para of nar.paragraphs || []) for (const x of para) {
    for (const c of (x.parts && x.parts.length > 1 ? x.parts.map(p => p.class) : [x.class])) present.add(cls(c));
  }
  return ["established", "developing", "unverified", "single", "disputed", "false"].filter(k => present.has(k))
    .map(k => `<span style="color:${KEYCOLOR[k]}">● ${esc(t.k[k])}</span>`).join("");
}
function whoHtml(p, t) {
  const all = [...(p.timeline || []).flat(), ...(p.undated || []), ...(p.established || []), ...(p.contested || []), ...(p.context || [])];
  if (!all.length) return "";
  const seen = new Set();
  const items = all.filter(i => i && i.text && !seen.has(i.text) && seen.add(i.text)).map(i => {
    const v = (i.verdict === "unverified" || i.verdict === "pending") && (i.n_sources || 0) <= 1 ? "single" : cls(i.verdict);
    const chips = (list, den) => {
      const byOutlet = new Map();
      for (const s of list) if (s.outlet && !byOutlet.has(s.outlet)) byOutlet.set(s.outlet, s.url);
      return [...byOutlet].map(([o, u]) => safeUrl(u)
        ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer"${den ? ' class="den"' : ""}>${esc(o)}</a>`
        : `<span${den ? ' class="den"' : ""}>${esc(o)}</span>`).join("");
    };
    const sup = (i.sources || []).filter(s => s.stance !== "denies"), den = (i.sources || []).filter(s => s.stance === "denies");
    return `<div class="stmt"><span class="dot" style="background:${KEYCOLOR[v] || "var(--unv)"}"></span><span class="s ${esc(v)}">${esc(i.text)}</span>
      ${sup.length ? `<div class="by"><span class="lbl">${esc(t.reported)}:</span>${chips(sup)}</div>` : ""}
      ${den.length ? `<div class="by"><span class="lbl">${esc(t.denied)}:</span>${chips(den, true)}</div>` : ""}</div>`;
  }).join("");
  return `<div class="paper"><details class="who"><summary>${esc(t.who)}</summary>${items}</details></div>`;
}
function articleHtml(row) {
  const t = T[lang];
  const p = (lang === "hi" && row.payload_hi) || row.payload_en || {};
  const nar = p.narrative || {};
  const sources = (nar.sources || []).map(s => {
    const why = s.read === false ? `<span class="why">${esc(s.readable === false ? t.unreadable : t.unread)}</span>` : "";
    const title = safeUrl(s.url) ? `<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title || s.url)}</a>` : esc(s.title || "");
    return `<li id="src-${esc(s.n)}" class="${s.read === false ? "unread" : ""}"><b>${esc(s.n)}</b><span><span class="outlet">${esc(s.outlet)}</span> · ${title}${why}</span></li>`;
  }).join("");
  const framing = (p.framing || []).length ? (() => {
    const persp = [...new Set(p.framing.flatMap(f => Object.keys(f.words || {})))].sort();
    return `<div class="sec">${esc(t.wording)}</div><div class="paper tablebox"><table class="framing"><thead><tr><th>${esc(t.fact)}</th>${persp.map(k => `<th>${esc(k)}</th>`).join("")}</tr></thead>
      <tbody>${p.framing.map(f => `<tr><td>${esc(f.text)}</td>${persp.map(k => `<td>${esc(((f.words || {})[k] || []).join(", "))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  })() : "";
  const persp = p.perspective_mode === "none" || !p.perspective_mode ? "" :
    Object.entries(p.perspectives || {}).map(([k, v]) => `<b>${esc(k)}</b> ${esc((v || []).join(", "))}`).join("<br>");
  const thread = (title, list) => list && list.length ? `<div class="sec">${esc(title)}</div><div class="paper"><ul class="thread">${list.map(x =>
      `<li><a href="#/story/${encodeURIComponent(x.story_id)}" data-story="${esc(x.story_id)}">${esc(x.headline)}</a></li>`).join("")}</ul></div>` : "";
  return `<div class="key">${keyHtml(t, nar)}</div>
    <div class="paper essay">${essayHtml(nar, t)}</div>
    ${p.suicide ? `<p class="note helpline">${esc(t.helpline)}</p>` : ""}
    ${thread(t.earlier, p.parents)}${thread(t.next, p.children)}
    ${sources ? `<div class="sec">${esc(t.sourcesTitle)}</div><div class="paper"><ol class="sources">${sources}</ol></div>` : ""}
    ${framing}
    ${persp ? `<div class="sec">${esc(t.perspectives)}</div><div class="paper persp">${persp}${p.perspective_mode === "story" ? `<br><span class="note">${esc(t.localNote)}</span>` : ""}</div>` : ""}
    <div style="height:12px"></div>${whoHtml(p, t)}`;
}
function fillSheet(row, card) {
  const t = T[lang];
  if (row) {
    const p = (lang === "hi" && row.payload_hi) || row.payload_en || {};
    const head = (lang === "hi" && row.headline_hi) || row.headline_en || p.headline || "";
    $("sheet-h").textContent = head;
    const n = (p.counts || {}).independent_sources || 0;
    $("sheet-meta").textContent = `${t.sources(n, (p.counts || {}).outlets)} · ${ago(row.updated_at)}`;
    $("rise").innerHTML = articleHtml(row);
    document.title = `${head} · Nishpaksh`;
  } else if (card) {
    $("sheet-h").textContent = card.h;
    $("sheet-meta").textContent = ago(card.at);
    $("rise").innerHTML = `<div class="paper essay" aria-busy="true"><p style="color:var(--muted)">${esc(t.loading)}</p></div>`;
  }
}
function cardRectFor(id) {
  const el = track.querySelector(`.slot[data-i="${current}"] a.card`) || (id != null ? track.querySelector(`a.card[data-id="${CSS.escape(String(id))}"]`) : null);
  if (!el) return null;
  const r = el.getBoundingClientRect();
  return r.height ? r : null;
}
function setClip(r) {
  const v = r ? `inset(${r.top}px ${innerWidth - r.right}px ${innerHeight - r.bottom}px ${r.left}px round 24px)` : "inset(0px 0px 0px 0px round 0px)";
  sheet.style.clipPath = v; sheet.style.webkitClipPath = v;
}
function placeHeadlineOver(r) {   // the article's headline starts exactly where the card's was
  hbox.style.setProperty("--hy", "0px"); hbox.style.setProperty("--hx", "22px");
  const h = hbox.getBoundingClientRect();
  hbox.style.setProperty("--hx", `${Math.max(0, r.left + 22 - h.left)}px`);
  hbox.style.setProperty("--hy", `${r.top + 24 - h.top}px`);
}
async function openStory(id, fromCard, opts = {}) {
  if (closing) { clearTimeout(closing); closing = null; }
  id = String(id);
  const card = cards.find(c => String(c.id) === id);
  openId = id;
  sheetScroll.scrollTop = 0;
  const pending = loadStory(id);
  const quick = await Promise.race([pending, new Promise(r => setTimeout(() => r(undefined), 120))]);
  if (openId !== id) return;
  fillSheet(quick || null, card);
  const r = fromCard && !opts.instant ? fromCard.getBoundingClientRect() : null;
  if (!opts.noHistory) {
    const u = `#/story/${encodeURIComponent(id)}`;
    if (location.hash !== u) { history.pushState({story: id}, "", u); openedFromDeck = true; }
  }
  sheet.classList.remove("anim", "open");
  sheet.classList.add("on");
  document.documentElement.classList.add("reading"); sections.inert = true;
  if (r) {
    setClip(r); placeHeadlineOver(r);
    void sheet.offsetWidth;                      // start from the card
    sheet.classList.add("anim");
    requestAnimationFrame(() => { setClip(null); sheet.classList.add("open"); });
  } else {
    setClip(null); sheet.classList.add("open");
  }
  if (!quick) {
    const row = await pending;
    if (openId !== id) return;
    if (row) fillSheet(row, card);
    else $("rise").innerHTML = `<div class="paper essay"><p>${esc(T[lang].missing)}</p></div>`;
  }
  setTimeout(() => { if (openId === id) $("back").focus({preventScroll: true}); }, 480);
}
function closeStory(animate = true) {
  if (!openId) return;
  const id = openId;
  openId = null;
  document.title = "Nishpaksh · निष्पक्ष";
  document.documentElement.classList.remove("reading"); sections.inert = false;
  const k = cards.findIndex(c => String(c.id) === id);
  if (k >= 0 && k !== current) jumpTo(k);
  const r = animate ? cardRectFor(id) : null;
  if (r) {
    sheet.classList.add("anim");
    placeHeadlineOverForClose(r);
    setClip(r); sheet.classList.remove("open");
    closing = setTimeout(() => { sheet.classList.remove("on", "anim"); closing = null; }, 470);
  } else {
    sheet.classList.remove("on", "anim", "open");
  }
  const el = track.querySelector(`.slot[data-i="${current}"] a.card`);
  if (el) el.focus({preventScroll: true});
}
function placeHeadlineOverForClose(r) {   // the open headline box goes back to where the card's headline is
  const h = hbox.getBoundingClientRect();
  hbox.style.setProperty("--hx", `${Math.max(0, r.left + 22 - h.left)}px`);
  hbox.style.setProperty("--hy", `${r.top + 24 - h.top}px`);
}
$("back").addEventListener("click", () => {
  if (openedFromDeck && history.state && history.state.story) history.back();
  else { history.replaceState(null, "", location.pathname + location.search); closeStory(true); }
});
window.addEventListener("popstate", () => route(true));

// source numbers and thread links work inside the sheet without leaving it
$("rise").addEventListener("click", e => {
  const s = e.target.closest("a[data-src]");
  if (s) {
    e.preventDefault();
    const li = $("src-" + s.dataset.src);
    if (li) { li.scrollIntoView({behavior: "smooth", block: "center"}); li.classList.add("flash"); setTimeout(() => li.classList.remove("flash"), 1400); }
    return;
  }
  const a = e.target.closest("a[data-story]");
  if (a) {
    e.preventDefault();
    history.pushState({story: a.dataset.story}, "", `#/story/${encodeURIComponent(a.dataset.story)}`);
    openedFromDeck = true;
    openStory(a.dataset.story, null, {instant: true, noHistory: true});
  }
});

/* ---------- sections: the bottom bar (owner, Oct 9 2026) ---------- */
const sections = $("sections"), sbar = $("sbar");
let pool = [], level = null, sec = null, fKey = "all", swapTimer = null, barLang = null;
function secLabels() { return SECTIONS[lang] || SECTIONS.en; }
function secLabel(k) { const s = secLabels(); return (s.primary || {})[k] || (s.secondary || {})[k] || ""; }
function inSection(c, k) {
  if (k === "all") return true;
  const cat = c.cat || {};
  return (cat.primary || []).includes(k) || (cat.secondary || []).includes(k);
}
function sectionCards() { return pool.filter(c => inSection(c, fKey)).slice(0, MAX_CARDS); }
const CHEV = `<svg class="chev" height="12" viewBox="0 0 10 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 2L2 7l5 5"/></svg>`;
function buildBar() {   // the buttons, once per language; layoutBar() moves them
  if (barLang === lang && sbar.childElementCount) { layoutBar(); return; }
  barLang = lang;
  const s = secLabels(), btn = (kind, key, parent) =>
    `<button type="button" class="sb" data-kind="${kind}" data-key="${esc(key)}" data-parent="${esc(parent || "")}"><span class="face">${CHEV}<span class="lbl">${esc(kind === "all" ? T[lang].all : secLabel(key))}</span></span></button>`;
  let h = btn("all", "all");
  for (const p of Object.keys(s.tree)) h += btn("primary", p);
  for (const p of Object.keys(s.tree)) for (const k of s.tree[p]) h += btn("sec", k, p);
  sbar.innerHTML = h;
  sections.setAttribute("aria-label", T[lang].nav);
  layoutBar();
}
let measureCtx = null;
function textWidth(txt, fs) {
  try {
    measureCtx = measureCtx || document.createElement("canvas").getContext("2d");
    measureCtx.font = `700 ${fs}px Hind, sans-serif`;
    return measureCtx.measureText(txt).width;
  } catch (e) { return Array.from(txt).length * fs * 0.56; }
}
// one line per label, one font size for every row, the same space between all six labels
function layoutBar() {
  const s = secLabels(), prims = Object.keys(s.tree), W = sbar.clientWidth || 360, CH = 13, MINPAD = 8;
  if (!prims.length) return;
  const rows = [[T[lang].all, ...prims.map(secLabel)]];
  for (const p of prims) rows.push([secLabel(p), ...s.tree[p].map(secLabel)]);
  const widths = (row, i, fs) => row.map((l, j) => textWidth(l, fs) + (i > 0 && j === 0 ? CH : 0));
  let fs = lang === "hi" ? 13.5 : 12.5;
  rows.forEach((row, i) => { const t = widths(row, i, fs).reduce((a, b) => a + b, 0); if (t + 6 * MINPAD > W) fs = Math.min(fs, fs * (W - 6 * MINPAD) / t); });
  fs = Math.max(9.5, Math.floor(fs * 4) / 4);
  sbar.style.fontSize = fs + "px";
  const place = (row, i) => {
    const ws = widths(row, i, fs), pad = Math.max(0, (W - ws.reduce((a, b) => a + b, 0)) / 6);
    let c = 0;
    return ws.map(w => { const r = [c / W * 100, (w + pad) / W * 100]; c += w + pad; return r; });
  };
  const lay0 = place(rows[0], 0), layP = {};
  prims.forEach((p, i) => { layP[p] = place(rows[i + 1], i + 1); });
  const count = k => pool.filter(c => inSection(c, k)).length;
  for (const b of sbar.children) {
    const kind = b.dataset.kind, key = b.dataset.key;
    let pos, show, back = false, on = false, delay = 0;
    if (kind === "all") { pos = lay0[0]; show = level === null; on = show; delay = 140; }
    else if (kind === "primary") {
      const i = prims.indexOf(key), open = level === key;
      pos = open ? layP[key][0] : lay0[i + 1]; show = level === null || open; back = open; on = open && !sec;
      delay = level === null ? 170 + i * 30 : 0;
    } else {
      const p = b.dataset.parent, j = s.tree[p].indexOf(key);
      pos = layP[p][j + 1]; show = level === p; on = sec === key; delay = 130 + j * 40;
    }
    b.style.left = pos[0] + "%"; b.style.width = pos[1] + "%";
    b.style.setProperty("--d", (show ? delay : 0) + "ms");
    b.classList.toggle("hide", !show); b.classList.toggle("isback", back);
    b.classList.toggle("empty", kind !== "all" && !back && count(key) === 0);
    b.setAttribute("aria-pressed", String(on)); b.tabIndex = show ? 0 : -1;
    if (show) b.removeAttribute("aria-hidden"); else b.setAttribute("aria-hidden", "true");
    if (back) b.setAttribute("aria-label", T[lang].secBack(secLabel(key))); else b.removeAttribute("aria-label");
  }
}
// the bar moves at once; the cards fade out, change to the section's, start at its newest, and fade in
function goSection(l, s) {
  level = l; sec = s;
  layoutBar();
  const key = sec || level || "all";
  if (key === fKey) return;
  fKey = key;
  clearTimeout(swapTimer);
  track.classList.add("swap");
  swapTimer = setTimeout(() => {
    cards = sectionCards();
    renderDeck(null);
    track.classList.remove("swap");
  }, 170);
}
sbar.addEventListener("click", e => {
  const b = e.target.closest("button.sb");
  if (!b || b.classList.contains("hide")) return;
  const kind = b.dataset.kind, key = b.dataset.key;
  if (kind === "all") goSection(null, null);
  else if (kind === "primary") goSection(level === key ? null : key, null);
  else goSection(b.dataset.parent, sec === key ? null : key);
});
new ResizeObserver(() => layoutBar()).observe(sbar);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => layoutBar());

/* ---------- language ---------- */
function applyLang() {
  document.documentElement.lang = lang;
  document.documentElement.classList.toggle("hi", lang === "hi");
  $("wm").textContent = T[lang].wordmark; $("wm2").textContent = T[lang].wordmark;
  $("greet").textContent = greeted ? greeting() : T[lang].hello;
  $("back").setAttribute("aria-label", T[lang].back);
  document.querySelectorAll(".pill button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
}
async function setLang(l) {
  if (l === lang || !T[l]) return;
  lang = l; safeSet("np-lang", l);
  const u = new URL(location); u.searchParams.set("lang", l); history.replaceState(history.state, "", u);
  applyLang();
  const keep = cards[current] && cards[current].id;
  if (openId) { const row = await loadStory(openId); if (row) fillSheet(row, null); }
  showDeck(openId || keep);
}
document.querySelectorAll(".pill button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));

/* ---------- keyboard (laptops): arrows move, Enter opens, Escape closes ---------- */
document.addEventListener("keydown", e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (openId) { if (e.key === "Escape") { e.preventDefault(); $("back").click(); } return; }
  if (["ArrowDown", "PageDown", "j"].includes(e.key)) { e.preventDefault(); step(1); }
  else if (["ArrowUp", "PageUp", "k"].includes(e.key)) { e.preventDefault(); step(-1); }
  else if (e.key === "Enter" && !(e.target.closest && e.target.closest("button"))) {
    const el = track.querySelector(`.slot[data-i="${current}"] a.card`); if (el) { e.preventDefault(); openStory(el.dataset.id, el); }
  }
});

/* ---------- routing: #/ is the deck, #/story/<id> an article ---------- */
function route(animate) {
  const m = location.hash.match(/^#\/story\/([^/?#]+)/);
  if (m) { const id = decodeURIComponent(m[1]); if (id !== openId) openStory(id, null, {instant: true, noHistory: true}); }
  else if (openId) { openedFromDeck = false; closeStory(animate); }
}

// keep the card in place when the phone rotates or the address bar resizes the screen
let lastH = 0;
new ResizeObserver(() => { const h = slotHeight(); if (h !== lastH) { lastH = h; if (cards.length) jumpTo(current); } }).observe(track);

// coming back to the page after a while: fresh news and greeting
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (greeted) $("greet").textContent = greeting();
  if (hiddenAt && Date.now() - hiddenAt > 15 * 60000) {
    const keep = cards[current] && cards[current].id;
    delete cardCache.en; delete cardCache.hi;
    showDeck(keep);
  } else if (!openId) track.querySelectorAll(".ago").forEach((el, i) => {
    const slot = el.closest(".slot"); const c = cards[Number(slot.dataset.i)]; if (c) el.textContent = ago(c.at);
  });
});

/* opening (owner, Oct 8-9 2026): the indigo with the wordmark fades away, then "Hello." for a second, then
   the greeting for the time of day */
let greeted = false;
function greetSoon() {
  setTimeout(() => {
    const el = $("greet");
    el.classList.add("swap");
    setTimeout(() => { greeted = true; el.textContent = greeting(); el.classList.remove("swap"); }, 220);
  }, 1000);
}
const started = performance.now();
let revealed = false;
function revealPage() {
  if (revealed) return;
  revealed = true;
  const root = document.documentElement;
  if (!root.classList.contains("launch")) { greetSoon(); return; }
  // the indigo stays at least half a second, so the splash and the page read as one screen
  setTimeout(() => {
    root.classList.add("ready");
    $("theme").setAttribute("content", "#ECECE9");
    setTimeout(greetSoon, 520);
  }, Math.max(0, 500 - (performance.now() - started)));
}
applyLang();
track.innerHTML = loadingHtml();
showDeck().finally(revealPage);
setTimeout(revealPage, 1600);     // never hold the splash longer than this
route(false);
if (/^#\/story\//.test(location.hash)) openedFromDeck = false;

if ("serviceWorker" in navigator && location.protocol === "https:") {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
