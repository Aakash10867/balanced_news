<style>
  /* nishpaksh_version_1.0 (owner, Oct 8 2026): one card at a time, the card grows into the article.
     Design approved on the canvas as trial_version_0.6; version 1.1 (indigo, serif headlines, upright greeting). Served at the main address since Oct 8 2026; /v1/ redirects here. */
  :root {
    --ground: #ECECE9;
    --card: #ffffff;
    --ink: #16181A;
    --ink-soft: #3d4043;
    --muted: #5f6368;
    --edge: #d3d3cf;
    /* sentence colours (text on white) */
    --est: #1d6a45; --dev: #13857a; --unv: #8a5a3c; --one: #6a3d9a; --dis: #8a6100; --fal: #b2251c;
    /* the colour bar */
    --bar-e: #2f8a5b; --bar-v: #2aa197; --bar-o: #7a4bb0; --bar-d: #d39a12; --bar-r: #c0392b; --bar-u: #b0835f;
    /* version 1.1 (owner, Oct 8 2026): one indigo, light to deep; the multicolour sweep read as Instagram */
    --brand: radial-gradient(120% 130% at 0% 0%, rgba(140,160,255,0.22) 0%, rgba(140,160,255,0) 55%),
             linear-gradient(135deg, #46549a 0%, #2f3a72 45%, #1f2550 75%, #161a38 100%);
    --ease: cubic-bezier(.2,.8,.2,1);
    --head: "Newsreader", Georgia, "Noto Serif Devanagari", serif;
    --body: "Hind", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  html.hi { --head: "Noto Serif Devanagari", "Hind", serif; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { background: var(--ground); color: var(--ink); font-family: var(--body); text-rendering: optimizeLegibility; }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid #46549a; outline-offset: 3px; border-radius: 6px; }

  #app { height: 100vh; height: 100dvh; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px;
         --padr: max(14px, env(safe-area-inset-right)); --padl: max(14px, env(safe-area-inset-left));
         padding: max(14px, env(safe-area-inset-top)) var(--padr) 0 var(--padl); }

  /* header: the wordmark, the greeting, the language switch */
  .brand { background: var(--brand); }
  .lift { text-shadow: 0 1px 2px rgba(0,0,0,0.35), 0 0 18px rgba(0,0,0,0.18); }
  header.top { color: #fff; border-radius: 22px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; flex: none; }
  .wordmark { display: flex; justify-content: center; font-family: "Alfa Slab One", "Rozha One", serif; font-size: 23px;
              letter-spacing: 0.6px; line-height: 1.15; }
  html.hi .wordmark { font-family: "Rozha One", serif; font-size: 26px; letter-spacing: 0.3px; }
  .greetrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .greeting { font-family: "Newsreader", Georgia, serif; font-weight: 500; font-size: 22px; line-height: 1.1; }
  html.hi .greeting { font-family: "Tiro Devanagari Hindi", serif; font-size: 21px; }
  .pill { display: flex; flex: none; background: rgba(18,12,30,0.34); border: 1px solid rgba(255,255,255,0.22); border-radius: 999px;
          padding: 3px; font-size: 14px; font-weight: 600; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .pill button { border: 0; background: transparent; color: #fff; border-radius: 999px; padding: 4px 11px; min-height: 30px; cursor: pointer;
                 transition: background-color 200ms ease, color 200ms ease; }
  .pill button[aria-pressed="true"] { background: #fff; color: #1f2550; }
  .pill.light { background: #fff; border: 0; box-shadow: 0 2px 0 var(--edge); -webkit-backdrop-filter: none; backdrop-filter: none; }
  .pill.light button { color: var(--ink); padding: 6px 11px; min-height: 36px; }
  .pill.light button[aria-pressed="true"] { background: linear-gradient(135deg, #46549a, #1f2550); color: #fff; }

  /* the deck: one card at a time, swiped up and down, looping */
  #deck { flex: 1; min-height: 0; position: relative; }
  .track { position: absolute; inset: 0; overflow-y: scroll; scroll-snap-type: y mandatory; overscroll-behavior: contain;
           scrollbar-width: none; -ms-overflow-style: none; outline: none; }
  .track::-webkit-scrollbar { display: none; width: 0; height: 0; }
  .slot { height: 100%; padding-bottom: 12px; scroll-snap-align: start; scroll-snap-stop: always; }
  .card { height: 100%; display: flex; flex-direction: column; background: var(--card); border-radius: 24px; box-shadow: 0 4px 0 var(--edge);
          padding: 24px 22px 18px; text-decoration: none; color: var(--ink); transition: transform 160ms ease; overflow: hidden; }
  .card:active { transform: scale(0.985); }
  .card h2 { margin: 0; font-family: var(--head); font-weight: 600; font-size: 27px; line-height: 1.15; letter-spacing: -0.005em; text-align: start; }
  html.hi .card h2 { font-size: 24px; line-height: 1.45; letter-spacing: 0; font-weight: 600; }
  .card .text { flex: 1; min-height: 0; overflow: hidden; margin-top: 14px; font-size: 17px; line-height: 1.65;
                -webkit-mask-image: linear-gradient(to bottom, #000 45%, transparent 100%); mask-image: linear-gradient(to bottom, #000 45%, transparent 100%); }
  .card .text p { margin: 0 0 10px; }
  .card .foot { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
  .bar { flex: 1; display: flex; height: 8px; border-radius: 999px; overflow: hidden; gap: 2px; }
  .bar span { flex-basis: 0; min-width: 0; }
  .ago { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .state { height: 100%; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px;
           background: var(--card); border-radius: 24px; box-shadow: 0 4px 0 var(--edge); color: var(--ink-soft); font-size: 16px; line-height: 1.5; }
  .loading .bone { background: #efefec; border-radius: 8px; height: 18px; margin: 0 0 12px; }

  /* sentence colours */
  .s.established, .s.corroborated, .s.confirmed { color: var(--est); }
  .s.developing { color: var(--dev); text-decoration: underline dotted #7fc4bb; text-underline-offset: 4px; }
  .s.unverified, .s.pending { color: var(--unv); }
  .s.single { color: var(--one); }
  .s.disputed { color: var(--dis); }
  .s.false { color: var(--fal); }
  .ftag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .06em; color: #fff; background: var(--fal);
          border-radius: 4px; padding: 1px 5px; margin-right: 5px; vertical-align: 2px; }

  /* the article: a sheet that grows out of the card */
  #sheet { position: fixed; inset: 0; z-index: 10; background: var(--card); visibility: hidden; }
  #sheet.on { visibility: visible; }
  #sheet.anim { transition: clip-path 460ms var(--ease), -webkit-clip-path 460ms var(--ease), background-color 460ms ease; }
  #sheet.open { background: var(--ground); }
  .sheet-scroll { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; touch-action: pan-y pinch-zoom; overscroll-behavior: contain; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .sheet-scroll::-webkit-scrollbar { display: none; }
  .col { max-width: 560px; margin: 0 auto; padding: 0 max(14px, env(safe-area-inset-right)) 48px max(14px, env(safe-area-inset-left)); }
  /* the article's top stays (owner, Oct 9 2026, canvas "Article · Calm + tiles + quotes + rail"): back | wordmark |
     language, the wordmark where and as big as on the home page, in the home page's indigo; under it the article's
     sections (the one being read is filled; tap to go) and a line in the same indigo that fills as you read */
  .chrome { position: sticky; top: 0; z-index: 3; margin: 0 calc(-1 * max(14px, env(safe-area-inset-left))); opacity: 0;
            padding: calc(max(14px, env(safe-area-inset-top)) + 7px) max(14px, env(safe-area-inset-right)) 0 max(14px, env(safe-area-inset-left));
            transition: background-color 240ms ease, box-shadow 240ms ease; }
  .chrome.stuck { background: rgba(236,236,233,0.88); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: 0 1px 0 rgba(0,0,0,0.06); }
  .crow { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; height: 44px; margin-bottom: 10px; }
  .crow > :first-child { justify-self: start; }
  .crow > :last-child { justify-self: end; }
  #sheet.anim .chrome { transition: opacity 260ms ease 220ms, background-color 240ms ease, box-shadow 240ms ease; }
  #sheet.open .chrome { opacity: 1; }
  .wm-ink { background: linear-gradient(135deg, #46549a 0%, #2f3a72 45%, #1f2550 75%, #161a38 100%); -webkit-background-clip: text;
            background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
  .rail { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 9px; scrollbar-width: none; }
  .rail::-webkit-scrollbar { display: none; }
  .rail:empty { display: none; }
  .rail button { flex: none; border: 0; border-radius: 999px; padding: 6px 12px; min-height: 32px; font-size: 13px; font-weight: 600; cursor: pointer;
                 background: #fff; color: var(--ink-soft); box-shadow: 0 2px 0 var(--edge); transition: background-color 220ms ease, color 220ms ease; }
  .rail button.on { background: #2f3a72; color: #fff; box-shadow: none; }
  .readline { height: 3px; margin: 0 calc(-1 * max(14px, env(safe-area-inset-left))); background: rgba(0,0,0,0.05); }
  .readline i { display: block; height: 100%; background: linear-gradient(90deg, #46549a 0%, #2f3a72 45%, #1f2550 75%, #161a38 100%);
                clip-path: inset(0 100% 0 0); }
  .back { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; border: 0;
          background: #fff; box-shadow: 0 2px 0 var(--edge); cursor: pointer; }
  .chrome .wordmark { font-size: 23px; }
  html.hi .chrome .wordmark { font-size: 26px; }
  /* opening and closing move only the headline and the picture, by transform (owner, Oct 9 2026: jitter on two
     Android phones while padding, width and height were animated): the box keeps its open layout throughout, the
     headline and the picture start over the card's (--tx/--ty, --pt, measured) and glide home; the rest fades */
  .hbox { position: relative; margin-top: 14px; border-radius: 22px; color: var(--ink); padding: 18px; }
  .hbox.has-pic { padding-top: 150px; }
  .hbox .layer { position: absolute; inset: 0; border-radius: 22px; opacity: 0; }
  #sheet.anim .hbox { transition: color 320ms ease 120ms; }
  #sheet.anim .hbox .layer { transition: opacity 340ms ease 100ms; }
  #sheet.open .hbox { color: #fff; }
  #sheet.open .hbox .layer { opacity: 1; }
  .hbox h1 { transform: translate(var(--tx, 0px), var(--ty, 0px)); }
  #sheet.anim .hbox h1 { transition: transform 460ms var(--ease); will-change: transform; }
  #sheet.open .hbox h1 { transform: none; text-shadow: 0 1px 2px rgba(0,0,0,0.35), 0 0 18px rgba(0,0,0,0.18); }
  /* the picture at the top of the indigo box, dissolving into it; the card's and the article's are one picture */
  .hbox .hpic { position: absolute; left: 0; right: 0; top: 0; height: 200px; border-radius: 22px 22px 0 0; overflow: hidden;
                opacity: 0; display: none; transform-origin: 0 0; transform: var(--pt, none); }
  .hbox.has-pic .hpic { display: block; }
  .hbox.morph .hpic { opacity: 1; }
  /* the image is laid out at its whole cover size (fitPic) and moved by its own transform, so on the way into and out
     of the card it is at exactly the card's zoom and crop: no zoom-in then snap (owner, Oct 10 2026) */
  .hbox .hpic { -webkit-mask-image: linear-gradient(to bottom, #000 45%, transparent 100%); mask-image: linear-gradient(to bottom, #000 45%, transparent 100%); }
  .hbox .hpic img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; display: block;
                    transform-origin: 50% 50%; transform: var(--it, none); }
  #sheet.anim .hbox .hpic img { transition: transform 460ms var(--ease); will-change: transform; }
  #sheet.open .hbox .hpic img { transform: none; }
  .hbox .hpic .hwash { position: absolute; inset: 0; pointer-events: none; opacity: 1;
                       background: linear-gradient(to bottom, rgba(255,255,255,0) 50%, rgba(255,255,255,0.55) 78%, #fff 100%); }
  .hbox .hpic .pic-credit { opacity: 0; }
  #sheet.anim .hbox .hpic { transition: opacity 340ms ease 100ms, transform 460ms var(--ease); will-change: transform; }
  #sheet.anim .hbox .hpic .hwash { transition: opacity 360ms ease; }
  #sheet.anim .hbox .hpic .pic-credit { transition: opacity 220ms ease 300ms; }
  #sheet.open .hbox .hpic { opacity: 1; transform: none; }
  #sheet.open .hbox .hpic .hwash { opacity: 0; }
  #sheet.open .hbox .hpic .pic-credit { opacity: 1; }
  .pic-credit { position: absolute; top: 10px; right: 12px; font-size: 11px; font-weight: 500; color: #fff; background: rgba(10,12,30,0.42);
                padding: 3px 8px; border-radius: 999px; text-decoration: none; }
  .hbox h1 { position: relative; margin: 0; max-width: var(--hw, none); font-family: var(--head); font-weight: 600; font-size: 27px; line-height: 1.15; letter-spacing: -0.005em; }
  html.hi .hbox h1 { font-size: 24px; line-height: 1.45; letter-spacing: 0; }
  .hbox .meta { position: relative; margin-top: 10px; font-size: 13px; opacity: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  /* share (owner, Oct 9 2026): at the right of the sources and time line */
  /* the size of the line's text: a bare icon; the touch area stays 36px through padding and negative margins */
  .share { flex: none; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; margin: -10px -10px -10px 0;
           border: 0; border-radius: 50%; background: transparent; color: #fff; cursor: pointer; transition: background-color 160ms ease; }
  .share:active { background: rgba(255,255,255,0.16); }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 20; transform: translate(-50%, 12px); opacity: 0;
           background: #1f2550; color: #fff; font-size: 14px; font-weight: 600; padding: 10px 16px; border-radius: 999px; pointer-events: none;
           box-shadow: 0 6px 18px rgba(22,26,56,0.25); transition: opacity 200ms ease, transform 260ms var(--ease); }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  #sheet.open .hbox .meta { opacity: .92; }
  #sheet.anim .hbox .meta { transition: opacity 260ms ease 260ms; }
  .rise { opacity: 0; transform: translateY(24px); }
  #sheet.anim .rise { transition: opacity 300ms ease 200ms, transform 420ms var(--ease) 160ms; }
  #sheet.open .rise { opacity: 1; transform: none; }
  /* closing: what is not on the card goes at once, so the headline and the picture travel back alone */
  #sheet.anim:not(.open) .rise { transition: opacity 110ms ease, transform 200ms ease, visibility 0s linear 110ms; visibility: hidden; }
  #sheet.anim:not(.open) .hbox .meta, #sheet.anim:not(.open) .chrome { transition: opacity 110ms ease; }
  #sheet.anim:not(.open) .hbox .layer { transition: opacity 280ms ease; }
  #sheet.anim:not(.open) .hbox .hpic .hwash { transition: opacity 300ms ease 80ms; }
  #sheet.anim:not(.open) .hbox .hpic .pic-credit { transition: opacity 110ms ease; }

  /* sections as cards with numbered headings; the lead alone; figures as tiles; what they say by speaker */
  .paper.lead { font-family: var(--head); font-size: 20px; line-height: 1.5; }
  html.hi .paper.lead { font-size: 19px; line-height: 1.75; }
  .sechead { display: flex; align-items: baseline; gap: 10px; margin: 26px 6px 0; scroll-margin-top: 150px; }
  .sechead span { font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; color: #46549a; }
  .sechead h3 { margin: 0; font-family: var(--head); font-size: 21px; font-weight: 600; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .tile { background: #fff; border-radius: 18px; padding: 14px 14px 12px; box-shadow: 0 3px 0 var(--edge); display: flex; flex-direction: column; gap: 6px; }
  .tile.wide { grid-column: 1 / -1; }
  .tile.lone { grid-column: 1 / -1; flex-direction: row; align-items: baseline; gap: 14px; }
  .tile.lone b { flex: none; max-width: 45%; }
  .tile b { font-family: var(--head); font-size: 26px; font-weight: 700; line-height: 1.05; color: #1f2550; overflow-wrap: anywhere; }
  .tile div { font-size: 14px; line-height: 1.45; }
  .quote .who { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #46549a; margin-bottom: 6px; }
  /* one quote mark per card, the section's symbol (owner, Oct 9 2026), not one per line: the lines are reported speech */
  .paper.quote { position: relative; padding-left: 46px; }
  .quote::before { content: "\201C"; position: absolute; left: 14px; top: 8px; font-family: "Newsreader", Georgia, serif; font-size: 46px;
                   line-height: 1; color: #46549a; }
  .quote p { margin: 0 0 10px; font-size: 17px; line-height: 1.65; }
  .quote p:last-child { margin-bottom: 0; }
  /* pictures on the cards (owner, Oct 9 2026, canvas "Pictures A"): sharp at the top, softly blurred and washed to
     white where the headline begins; a card without a picture is as before */
  .card.has-pic { padding-top: 0; }
  .card .pic { position: relative; flex: none; height: 46%; margin: 0 -22px; overflow: hidden; background: #f1f1ee; }
  .card .pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .pic .soft { filter: blur(16px) saturate(1.1); transform: scale(1.15); }
  .card .pic .sharp { -webkit-mask-image: linear-gradient(to bottom, #000 52%, transparent 82%); mask-image: linear-gradient(to bottom, #000 52%, transparent 82%); }
  .card .pic .wash { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(255,255,255,0) 50%, rgba(255,255,255,0.55) 78%, #fff 100%); }
  .card.has-pic h2 { position: relative; margin-top: -70px; }
  .key { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 12px 4px 0; font-size: 13px; font-weight: 500; }
  .key span { white-space: nowrap; }
  .paper { margin-top: 12px; background: #fff; border-radius: 20px; padding: 16px; box-shadow: 0 3px 0 var(--edge); }
  .essay { font-size: 17.5px; line-height: 1.7; }
  html.hi .essay { font-size: 18px; line-height: 1.8; }
  .essay p { margin: 0 0 12px; }
  .essay p:last-child { margin-bottom: 0; }
  .essay h3 { font-family: var(--head); font-size: 19px; font-weight: 600; letter-spacing: -0.01em; margin: 20px 0 8px; color: var(--ink); }
  sup { font-size: 10.5px; line-height: 0; color: #7a7d81; margin-left: 1px; }

  const out = []; let n = 0;

    if (n >= limit) break;
    const keep = [];
    for (const s of para || []) {
      if (n >= limit) break;
      const it = {t: s.text || "", c: s.class || "unverified"};
      if (s.parts && s.parts.length > 1) it.p = s.parts.map(p => ({t: p.text || "", c: p.class || "unverified"}));

    if (keep.length) out.push(keep);
  }
  return out;

/* audio: one new request a day per reader; audio already made is free (owner) */
const istDayStart = () => { const ist = new Date(Date.now() + 5.5 * 3600e3); ist.setUTCHours(0, 0, 0, 0); return new Date(ist.getTime() - 5.5 * 3600e3).toISOString(); };
/* the audio and video cards open complete (owner, Oct 10 2026: they opened, then the options or videos jumped in):
   their data is fetched when the article opens, and a tap waits for it before the card slides up */
const pre = {id: null, audio: null, videos: null};
function audioData(id) {
  return Promise.all([
    api(`audio_files?select=lang&key=in.(${id}-en,${id}-hi)`),
    rest(`audio_requests?select=id&requested_at=gte.${encodeURIComponent(istDayStart())}`),
    rest(`audio_requests?select=lang&story_id=eq.${encodeURIComponent(id)}&status=eq.queued`)])
    .then(([files, mineToday, mineHere]) => ({id, loaded: true, ready: files.map(f => f.lang), left: Math.max(0, 1 - mineToday.length), mine: mineHere.map(r => r.lang)}))
    .catch(e => e.message === "login" ? {id, login: true} : {id, loaded: true, ready: [], left: 1, mine: []});
}
const vlang = v => /[\u0900-\u097f]/.test(v.title || "") || HINGLISH.test(v.title || "") ? "hi" : "en";
const HINGLISH = /\b(kya|hai|hain|mein|kaise|kyun|kyon|nahi|nahin|aur|ki|ka|ke|ko|se|tha|thi|hua|hui|kab|kaun|bada|badi)\b.*\b(kya|hai|hain|mein|kaise|kyun|kyon|nahi|nahin|aur|ki|ka|ke|ko|se|tha|thi|hua|hui|kab|kaun|bada|badi)\b/i;
function videoData(id) {
  return api(`videos?select=items&story_id=eq.${encodeURIComponent(id)}`).then(rows => {
    const items = ((rows[0] && rows[0].items) || []).map(v => ({...v, lang: vlang(v)}));
    const hi = items.filter(v => v.lang === "hi"), en = items.filter(v => v.lang !== "hi"), out = [];
    for (let k = 0; k < Math.max(hi.length, en.length); k++) { if (hi[k]) out.push(hi[k]); if (en[k]) out.push(en[k]); }
    return out;
  }).catch(() => []);
}
function prefetch(id) {
  pre.id = id; pre.videos = videoData(id); pre.audio = me ? audioData(id) : null;
}
async function waitFor(btn, p) {
  if (btn) btn.classList.add("waiting");
  try { return await p; } finally { if (btn) btn.classList.remove("waiting"); }
}
async function openAudio(btn) {
  const id = openId;
  if (!id) return;
  if (!me) { afterSignin = () => { prefetch(id); openAudio(); }; authMode = "signup"; openSheet("signin"); return; }
  if (pre.id !== id || !pre.audio) { pre.id = id; pre.audio = audioData(id); }
  const st = await waitFor(btn, pre.audio);
  pre.audio = null;                      // asked again next time: a request may have been made since
  if (openId !== id) return;
  if (st.login) { afterSignin = openAudio; openSheet("signin"); return; }
  audioState = st; chosenLang = null; openSheet("audio");
}
async function makeAudio() {
  const id = audioState.id, l = chosenLang || lang, perm = askPermission();   // asked inside the tap (Safari needs that)
  busy = true; renderSheet();
  try {
    const r = await rest("rpc/request_audio", {method: "POST", body: JSON.stringify({p_story: Number(id), p_lang: l})});
    busy = false;
    if (r.status === "ready") { audioState.ready.push(l); renderSheet(); return; }
    if (r.status === "gone") audioState.gone = true;
    else if (r.status === "limit") audioState.left = 0;
    else { audioState.mine.push(l); audioState.left = Math.max(0, audioState.left - 1); subscribePush(perm); }
    renderSheet();
  } catch (e) { busy = false; sheetErr = T[lang].errs.net; renderSheet(); }
}
function askPermission() {
  if (!("Notification" in window)) return Promise.resolve("unsupported");
  if (Notification.permission !== "default") return Promise.resolve(Notification.permission);
  try { return Notification.requestPermission(); } catch (e) { return Promise.resolve("default"); }
}
async function subscribePush(permP) {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) return;
  if ((await permP) !== "granted") return;
  try {
    const raw = b64url(VAPID);
    const reg = await navigator.serviceWorker.ready;
    const sub = (await reg.pushManager.getSubscription()) ||
      await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: Uint8Array.from(raw, c => c.charCodeAt(0))});
    const j = sub.toJSON(), uid = myId();
    await rest("push_subscriptions?on_conflict=endpoint", {method: "POST", headers: {Prefer: "resolution=merge-duplicates"},
      body: JSON.stringify({endpoint: j.endpoint, reader: uid, p256dh: j.keys.p256dh, auth: j.keys.auth, lang})});
  } catch (e) { /* the notification still waits in the database */ }
}

/* videos: YouTube's order, Hindi first, the two languages in turn (owner) */
async function openVideos(btn) {
  const id = openId;
  if (!id) return;
  if (pre.id !== id || !pre.videos) { pre.id = id; pre.videos = videoData(id); }
  const out = await waitFor(btn, pre.videos);
  if (openId !== id) return;
  audioState = {...(audioState || {}), videos: out};
  openSheet("video");
}

/* the player: each sentence lit in its own colour while it is read (owner: highlighting only) */
const player = {el: null, key: null, units: [], on: null};
const pbar = document.createElement("div");
pbar.className = "player brand";
pbar.innerHTML = `<button type="button" id="p-pp">${ICON.pause}</button><input type="range" id="p-seek" min="0" max="1000" value="0"><span class="tl" id="p-tl">0:00</span><button type="button" id="p-x">${ICON.x.replace('#3d4043', 'currentColor')}</button>`;
document.body.append(pbar);
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
async function playAudio(key) {
  if (!player.el) {
    player.el = new Audio(); player.el.preload = "auto";
    player.el.addEventListener("timeupdate", () => light(false));
    player.el.addEventListener("play", () => { $("p-pp").innerHTML = ICON.pause; $("p-pp").setAttribute("aria-label", T[lang].pause); });
    player.el.addEventListener("pause", () => { $("p-pp").innerHTML = ICON.play; $("p-pp").setAttribute("aria-label", T[lang].play); });
    player.el.addEventListener("ended", unlight);
  }
  player.key = key; player.units = [];
  try { player.units = (await getJSON(`audio/${key}.json`)).units || []; } catch (e) { /* plays without the lighting */ }
  player.el.src = `audio/${key}.m4a`;
  $("p-seek").setAttribute("aria-label", T[lang].seek); $("p-x").setAttribute("aria-label", T[lang].close);
  pbar.classList.add("on");
  player.el.play().catch(() => {});
}
$("p-pp").addEventListener("click", () => { const a = player.el; if (a) a.paused ? a.play() : a.pause(); });
$("p-x").addEventListener("click", () => { if (player.el) player.el.pause(); pbar.classList.remove("on"); unlight(); player.key = null; });
$("p-seek").addEventListener("input", e => { const a = player.el; if (a && a.duration) a.currentTime = a.duration * e.target.value / 1000; });
function unlight() { document.querySelectorAll(".sent.lit").forEach(x => x.classList.remove("lit")); player.on = null; }
function light(force) {
  const a = player.el;
  if (!a || !player.key) return;
  if (a.duration) { $("p-seek").value = String(Math.round(1000 * a.currentTime / a.duration)); $("p-tl").textContent = `${fmt(a.currentTime)} / ${fmt(a.duration)}`; }
  const us = player.units;
  if (!us.length) return;
  let lo = 0, hi = us.length - 1, k = 0;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (us[m].t <= a.currentTime) { k = m; lo = m + 1; } else hi = m - 1; }
  const u = us[k], tag = `${u.p}.${u.s}`;
  if (tag === player.on && !force) return;
  unlight(); player.on = tag;
  const [sid, l] = player.key.split("-");
  if (openId !== sid || lang !== l || u.s < 0) return;
  const el = $("rise").querySelector(`.sent[data-k="${tag}"]`);
  if (el) { el.classList.add("lit"); if (!a.paused) el.scrollIntoView({block: "center", behavior: STILL.matches ? "auto" : "smooth"}); }
}

  recapAt: "आज का सार बनेगा", recapTime: "रात 11:00 बजे", recapIn: x => `${x} में`, recapAbout: "दिन की ख़बरें संक्षेप में, खंड के अनुसार, हिंदी और अंग्रेज़ी में। लेख पढ़ने के लिए किसी पंक्ति पर टैप करें।",
  recapMaking: "आज का सार बन रहा है। कुछ ही मिनटों में यहां होगा।", notifyMe: "तैयार होने पर मुझे बताएं", listenRecap: "सुनें",
  articles: n => `आज की ${n} ख़बरें`, hm: (h, m) => `${h} घंटे ${m} मिनट`, recapReadyHint: "तैयार", recapTimeHint: "रात 11", stop: "फ़ॉलो बंद करें"});
const STATES = [["andhra-pradesh", "Andhra Pradesh", "आंध्र प्रदेश"], ["arunachal-pradesh", "Arunachal Pradesh", "अरुणाचल प्रदेश"], ["assam", "Assam", "असम"], ["bihar", "Bihar", "बिहार"], ["chhattisgarh", "Chhattisgarh", "छत्तीसगढ़"], ["goa", "Goa", "गोवा"], ["gujarat", "Gujarat", "गुजरात"], ["haryana", "Haryana", "हरियाणा"], ["himachal-pradesh", "Himachal Pradesh", "हिमाचल प्रदेश"], ["jharkhand", "Jharkhand", "झारखंड"], ["karnataka", "Karnataka", "कर्नाटक"], ["kerala", "Kerala", "केरल"], ["madhya-pradesh", "Madhya Pradesh", "मध्य प्रदेश"], ["maharashtra", "Maharashtra", "महाराष्ट्र"], ["manipur", "Manipur", "मणिपुर"], ["meghalaya", "Meghalaya", "मेघालय"], ["mizoram", "Mizoram", "मिज़ोरम"], ["nagaland", "Nagaland", "नगालैंड"], ["odisha", "Odisha", "ओडिशा"], ["punjab", "Punjab", "पंजाब"], ["rajasthan", "Rajasthan", "राजस्थान"], ["sikkim", "Sikkim", "सिक्किम"], ["tamil-nadu", "Tamil Nadu", "तमिलनाडु"], ["telangana", "Telangana", "तेलंगाना"], ["tripura", "Tripura", "त्रिपुरा"], ["uttar-pradesh", "Uttar Pradesh", "उत्तर प्रदेश"], ["uttarakhand", "Uttarakhand", "उत्तराखंड"], ["west-bengal", "West Bengal", "पश्चिम बंगाल"], ["andaman-nicobar", "Andaman and Nicobar Islands", "अंडमान और निकोबार"], ["chandigarh", "Chandigarh", "चंडीगढ़"], ["dadra-daman-diu", "Dadra and Nagar Haveli and Daman and Diu", "दादरा और नगर हवेली और दमन और दीव"], ["delhi", "Delhi", "दिल्ली"], ["jammu-kashmir", "Jammu and Kashmir", "जम्मू-कश्मीर"], ["ladakh", "Ladakh", "लद्दाख"], ["lakshadweep", "Lakshadweep", "लक्षद्वीप"], ["puducherry", "Puducherry", "पुडुचेरी"]];
const stateLabel = k => { const s = STATES.find(x => x[0] === k); return s ? s[lang === "hi" ? 2 : 1] : k; };

/* the reader's follows: "kind|key" -> label; saved straight to the database */
let follows = new Map(), unread = 0, followSub = null, followBusy = false;
async function loadFollows() {
  if (!me) { follows = new Map(); return; }
  try { follows = new Map((await rest("follows?select=kind,key,label")).map(r => [`${r.kind}|${r.key}`, r.label || r.key])); } catch (e) { /* offline */ }
}
const isF = (kind, key) => follows.has(`${kind}|${key}`);
async function setFollow(kind, key, on, label) {
  const k = `${kind}|${key}`;
  if (on === follows.has(k)) return;
  if (on) {
    follows.set(k, label || key);
    await rest("follows", {method: "POST", headers: {Prefer: "resolution=ignore-duplicates"}, body: JSON.stringify({reader: myId(), kind, key, label: label || key})});
  } else {
    follows.delete(k);
    await rest(`follows?kind=eq.${encodeURIComponent(kind)}&key=eq.${encodeURIComponent(key)}`, {method: "DELETE"});
  }
}
async function countUnread() {
  if (!me) { unread = 0; paintBadge(); return; }
  try { unread = (await rest("notifications?select=id&read_at=is.null&limit=99")).length; } catch (e) { /* offline */ }
  paintBadge();
}
function paintBadge() {
  const old = mbtn.querySelector(".mbadge"); if (old) old.remove();
  if (unread > 0) mbtn.insertAdjacentHTML("beforeend", `<span class="mbadge">${unread > 9 ? "9+" : unread}</span>`);
}
function needSignin(then) { afterSignin = then; authMode = "signup"; openSheet("signin"); }
function asSheet(kind) { hideMenu(); if (!me) { needSignin(() => { sheetKind = kind; openKind(kind); }); return; } openSheet(kind); openKind(kind); }
function openKind(kind) {
  if (kind === "follow") { followSub = null; loadFollows().then(() => { if (sheetKind === "follow") renderSheet(); }); }
  else if (kind === "notes") loadNotes();
  else if (kind === "recap") loadRecap();
  renderSheet();
}

/* Following: sections (all of one by its circle, or inside by its arrow), states, words and names */
function secRows() {
  const S = SECTIONS[lang] || SECTIONS.en, t = T[lang];
  return Object.entries(S.tree).map(([p, subs]) => {
    const full = isF("section", p), n = subs.filter(s => isF("section", `${p}/${s}`)).length;
    return {p, label: S.primary[p], full, part: !full && n > 0, note: full ? t.all : n ? t.of(n, subs.length) : ""};
  });
}
function followHtml() {
  const t = T[lang], S = SECTIONS[lang] || SECTIONS.en;
  const row = (attrs, label, cls, note, go) => `<div class="frow${cls.includes("full") || cls.includes("part") || cls.includes("on") ? " on" : ""}">
      <button type="button" class="pick" ${attrs}><span class="circ ${cls}">${cls.includes("full") ? ICON.tickw : ""}</span><span class="grow" style="flex:1;min-width:0">${esc(label)}</span>${note ? `<span class="note">${esc(note)}</span>` : ""}</button>
      ${go ? `<button type="button" class="go" ${go} aria-label="${esc(label)}">${ICON.chev}</button>` : ""}</div>`;
  const states = STATES.filter(s => isF("place", s[0])).map(s => s[lang === "hi" ? 2 : 1]);
  const words = [...follows].filter(([k]) => k.startsWith("entity|")).map(([, l]) => l);
  const main = `<p class="bnote" style="margin:0 4px 6px;font-size:14px;line-height:1.45">${esc(t.followIntro)}</p>
    <div class="flabel">${esc(t.sectionsL)}</div>
    ${secRows().map(r => row(`data-fall="${r.p}"`, r.label, r.full ? "full" : r.part ? "part" : "", r.note, `data-fsub="${r.p}"`)).join("")}
    <div class="flabel">${esc(t.placesL)}</div>
    ${row(`data-fsub="states"`, t.states, `dash${states.length ? " on" : ""}`, states.join(", "), `data-fsub="states"`)}
    ${row(`data-fsub="words"`, t.words, `dash${words.length ? " on" : ""}`, words.length ? String(words.length) : "", `data-fsub="words"`)}`;
  let sub = "";
  if (followSub === "states") {
    sub = STATES.map(([k, en, hi]) => { const on = isF("place", k); return row(`data-fone="place|${k}|${esc(en)}"`, lang === "hi" ? hi : en, on ? "full" : "", "", ""); }).join("");
  } else if (followSub === "words") {
    sub = `<p class="bnote" style="margin:4px 4px 12px;font-size:14px">${esc(t.wordsIntro)}</p>
      <form id="wordform" style="display:flex;gap:8px"><input class="bfield" id="f-word" style="flex:1;min-width:0" placeholder="${esc(t.wordPh)}" maxlength="60" autocomplete="off">
      <button type="submit" class="bgo brand" style="height:48px;padding:0 16px;font-size:16px">${esc(t.followBtn)}</button></form>
      <div class="fchips">${words.map(w => `<span class="fchip">${esc(w)}<button type="button" data-fword="${esc(w)}" aria-label="${esc(t.stop)}">${ICON.xs}</button></span>`).join("")}</div>`;
  } else if (followSub) {
    const p = followSub, all = isF("section", p), label = S.primary[p];
    sub = row(`data-fall="${p}"`, t.allOf(label), all ? "full" : "", "", "") +
      (S.tree[p] || []).map(s => { const on = all || isF("section", `${p}/${s}`); return row(`data-fone="section|${p}/${s}|${esc(S.secondary[s] || s)}"`, S.secondary[s] || s, on ? "full" : "", "", ""); }).join("");
  }
  return `<div class="fwrap"><div class="fpanes${followSub ? " sub" : ""}"><div class="fpane">${main}</div><div class="fpane">${sub}</div></div></div>`;
}
async function followClick(b) {
  if (followBusy) return;
  const S = SECTIONS.en;
  followBusy = true;
  try {
    if (b.dataset.fsub) { followSub = b.dataset.fsub; renderSheet(); return; }
    if (b.dataset.fall) {                                   // the circle: all of the section, or nothing
      const p = b.dataset.fall, on = !isF("section", p);
      const jobs = [setFollow("section", p, on, S.primary[p])];
      for (const s of S.tree[p] || []) jobs.push(setFollow("section", `${p}/${s}`, false));
      renderSheet(); await Promise.all(jobs);
    } else if (b.dataset.fone) {
      const [kind, key, label] = b.dataset.fone.split("|");
      if (kind === "section") {                             // one sub-section; all of them = the whole section
        const p = key.split("/")[0], subs = S.tree[p] || [];
        let chosen = isF("section", p) ? subs.slice() : subs.filter(s => isF("section", `${p}/${s}`));
        const s = key.split("/")[1];
        chosen = chosen.includes(s) ? chosen.filter(x => x !== s) : [...chosen, s];
        const whole = chosen.length === subs.length;
        const jobs = [setFollow("section", p, whole, S.primary[p])];
        for (const x of subs) jobs.push(setFollow("section", `${p}/${x}`, !whole && chosen.includes(x), S.secondary[x]));
        renderSheet(); await Promise.all(jobs);
      } else { const job = setFollow(kind, key, !isF(kind, key), label); renderSheet(); await job; }
    } else if (b.dataset.fword) { const w = b.dataset.fword; const job = setFollow("entity", w.toLowerCase(), false); renderSheet(); await job; }
    askPermission().then(p => subscribePush(Promise.resolve(p)));
  } catch (e) { toast(T[lang].error); await loadFollows(); renderSheet(); }
  finally { followBusy = false; }
}
bsheet.addEventListener("submit", async e => {
  if (e.target.id !== "wordform") return;
  e.preventDefault(); e.stopImmediatePropagation();
  const w = ($("f-word").value || "").replace(/\s+/g, " ").trim();
  if (!w) return;
  try { const job = setFollow("entity", w.toLowerCase(), true, w); renderSheet(); await job; askPermission().then(p => subscribePush(Promise.resolve(p))); }
  catch (err) { toast(T[lang].error); }
}, true);

/* Notifications: my audio first, then every notification (opening marks them read) */
let notesData = null;
async function loadNotes() {
  notesData = null;
  try {
    const [notes, reqs] = await Promise.all([
      rest("notifications?select=id,kind,title,body,url,created_at,read_at&order=created_at.desc&limit=50"),
      rest("audio_requests?select=story_id,lang,status,requested_at&order=requested_at.desc&limit=20")]);
    const heads = {};
    await Promise.all([...new Set(reqs.map(r => String(r.story_id)))].map(async id => {
      const c = (pool || []).find(x => String(x.id) === id);
      if (c) { heads[id] = c.h; return; }
      const row = await loadStory(id).catch(() => null);
      heads[id] = row ? ((lang === "hi" && row.headline_hi) || row.headline_en) : "";
    }));
    notesData = {notes, reqs: reqs.map(r => ({...r, h: heads[String(r.story_id)] || ""}))};
    const ids = notes.filter(n => !n.read_at).map(n => n.id);
    if (ids.length) rest(`notifications?id=in.(${ids.join(",")})`, {method: "PATCH", body: JSON.stringify({read_at: new Date().toISOString()})})
      .then(() => { unread = 0; paintBadge(); }).catch(() => {});
  } catch (e) { notesData = {notes: [], reqs: []}; }
  if (sheetKind === "notes") renderSheet();
}
function notesHtml() {
  const t = T[lang];
  if (!notesData) return `<div class="bbody"><p class="bnote">…</p></div>`;
  const ln = l => l === "hi" ? t.hindi : t.english;
  const when = ts => { const d = new Date(ts); return d.toLocaleString(lang === "hi" ? "hi-IN" : "en-IN", {hour: "2-digit", minute: "2-digit", day: "numeric", month: "short", timeZone: "Asia/Kolkata"}); };
  const audios = notesData.reqs.length ? notesData.reqs.map(r => `<div class="naudio"><div style="flex:1;min-width:0"><div class="h">${esc(r.h)}</div>
      <div style="font-size:13px;font-weight:600;margin-top:3px;color:${r.status === "done" ? "var(--est)" : r.status === "failed" ? "var(--fal)" : "var(--dis)"}">${esc(r.status === "done" ? t.ready(ln(r.lang)) : r.status === "failed" ? t.failed(ln(r.lang)) : t.making(ln(r.lang)))}</div></div>
      ${r.status === "done" ? `<button type="button" class="brand" data-nplay="${esc(r.story_id)}-${esc(r.lang)}" aria-label="${esc(t.play)}">${ICON.play}</button>` : r.status === "queued" ? `<span style="width:40px;display:flex;justify-content:center">${ICON.clock}</span>` : ""}</div>`).join("")
    : `<p class="bnote" style="margin:6px 2px">${esc(t.noAudio)}</p>`;
  const notes = notesData.notes.length ? notesData.notes.map(n => `<button type="button" class="nrow" data-nurl="${esc(n.url || "")}"><span class="dot" style="background:${n.read_at ? "transparent" : "#c0392b"}"></span>
      <span style="flex:1;min-width:0"><span style="display:block;font-size:15px;font-weight:${n.read_at ? 400 : 600};line-height:1.3">${esc(n.title)}</span><span class="bnote" style="display:block;margin-top:3px">${esc(n.body || "")}</span></span>
      <span style="font-size:12px;color:#9a9ca3;white-space:nowrap">${esc(when(n.created_at))}</span></button>`).join("")
    : `<p class="bnote" style="margin:6px 2px">${esc(t.noNotes)}</p>`;
  return `<div class="bbody" style="flex:1;min-height:0;gap:0"><div class="flabel" style="margin-top:4px">${esc(t.myAudio)}</div>${audios}<div class="flabel" style="margin-top:18px">${esc(t.notes)}</div>${notes}</div>`;
}

/* Daily recap: before 11 pm, when and how long; then the day's articles, Listen, and Notify me */
let recapData = null;
const istNow = () => new Date(Date.now() + 5.5 * 3600e3);
const istDay = () => istNow().toISOString().slice(0, 10);
async function loadRecap() {
  recapData = null;
  const day = istDay(), mins = istNow().getUTCHours() * 60 + istNow().getUTCMinutes();
  let row = null;
  if (mins >= 23 * 60) {
    try { row = (await api(`recaps?select=day,payload_en,payload_hi&day=eq.${day}`))[0] || null; } catch (e) { row = null; }
  }
  if (me) await loadFollows();
  recapData = {day, mins, row};
  if (sheetKind === "recap") renderSheet();
}
function recapHtml() {
  const t = T[lang];
  if (!recapData) return `<div class="bbody"><p class="bnote">…</p></div>`;
  const {mins, row, day} = recapData, on = isF("recap", "daily");
  const left = (23 * 60 - mins + 1440) % 1440;
  const toggle = `<div class="rnotify">${ICON.bellg}<span style="flex:1;font-size:16px">${esc(t.notifyMe)}</span>
    <button type="button" class="tog" role="switch" aria-checked="${on}" data-recapnotify="1" aria-label="${esc(t.notifyMe)}"><i></i></button></div>`;
  if (mins < 23 * 60) return `<div class="bbody"><div class="rclock brand"><div style="font-size:14px;opacity:.85">${esc(t.recapAt)}</div><b class="big">${esc(t.recapTime)}</b>
      <div style="font-size:16px;margin-top:8px">${esc(t.recapIn(t.hm(Math.floor(left / 60), left % 60)))}</div></div>
      <p class="bnote" style="font-size:14px;line-height:1.5;margin:4px 2px">${esc(t.recapAbout)}</p>${toggle}</div>`;
  if (!row) return `<div class="bbody"><div class="rclock brand"><div style="font-size:16px;line-height:1.5">${esc(t.recapMaking)}</div></div>${toggle}</div>`;
  const p = (lang === "hi" && row.payload_hi) || row.payload_en || {}, items = p.stories || [];
  const date = new Date(`${day}T12:00:00Z`).toLocaleDateString(lang === "hi" ? "hi-IN" : "en-IN", {weekday: "long", day: "numeric", month: "long"});
  // the day's brief (owner, Oct 10 2026): section by section, one short sentence per story in the colour of the
  // lead it comes from; a tap on a sentence opens its article. Older recaps (headline + lead) still show as a list.
  const body = p.sections ? p.sections.map(sc => `<div class="flabel" style="margin-top:16px">${esc(sc.label)}</div>
      <p class="rbrief">${sc.sents.map(x => `<span class="rs" role="button" tabindex="0" data-rstory="${esc(x.id)}">${sentenceHtml(x)}</span>`).join("")}</p>`).join("")
    : items.map(it => `<button type="button" class="ritem" data-rstory="${esc(it.id)}"><div class="h">${esc(it.h)}</div><p>${(it.lead || []).map(sentenceHtml).join("")}</p></button>`).join("");
  return `<div class="bbody" style="flex:1;min-height:0;gap:0">
    <div style="margin:4px 0 6px"><div class="bnote" style="font-size:14px">${esc(date)}</div><div style="font-weight:600">${esc(t.articles(items.length))}</div></div>
    ${toggle}${body}</div>`;
}

bsheet.addEventListener("click", async e => {
  const b = e.target.closest("button, .rs"); if (!b || !sheetKind) return;
  if (sheetKind === "follow" && (b.dataset.fsub || b.dataset.fall || b.dataset.fone || b.dataset.fword)) { e.stopImmediatePropagation(); followClick(b); return; }
  if (b.dataset.fback) { e.stopImmediatePropagation(); followSub = null; renderSheet(); return; }
  if (b.dataset.nplay) { e.stopImmediatePropagation(); const k = b.dataset.nplay; closeSheet(); playAudio(k); return; }
  if (b.dataset.nurl !== undefined) {
    e.stopImmediatePropagation();
    const m = (b.dataset.nurl || "").match(/#\/story\/(\d+)/);
    closeSheet();
    if (m) setTimeout(() => { history.pushState({story: m[1]}, "", `#/story/${m[1]}`); openedFromDeck = true; openStory(m[1], null, {instant: true, noHistory: true}); }, 80);
    else if (/#\/recap/.test(b.dataset.nurl || "")) setTimeout(() => asSheet("recap"), 320);
    return;
  }
  if (b.dataset.recapnotify) {
    e.stopImmediatePropagation();
    const on = !isF("recap", "daily");
    try { const job = setFollow("recap", "daily", on, "recap"); renderSheet(); await job; if (on) askPermission().then(p => subscribePush(Promise.resolve(p))); }
    catch (err) { toast(T[lang].error); }
    return;
  }
  if (b.dataset.rstory) {
    e.stopImmediatePropagation();
    const id = b.dataset.rstory; closeSheet();
    setTimeout(() => { history.pushState({story: id}, "", `#/story/${id}`); openedFromDeck = true; openStory(id, null, {instant: true, noHistory: true}); }, 80);
  }
}, true);

paintMe();
if (me) { loadFollows(); countUnread(); }
document.addEventListener("visibilitychange", () => { if (!document.hidden) countUnread(); });
// a signed-in reader whose browser already allows notifications is (re)registered on every visit
if (me && "Notification" in window && Notification.permission === "granted") setTimeout(() => subscribePush(Promise.resolve("granted")), 3000);
applyLang();
track.innerHTML = loadingHtml();
showDeck().finally(revealPage);
setTimeout(revealPage, 1600);     // never hold the splash longer than this
route(false);
if (/^#\/story\//.test(location.hash)) openedFromDeck = false;

if ("serviceWorker" in navigator && location.protocol === "https:") {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
